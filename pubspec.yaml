name: billares_don_miguel
description: Sistema de control de mesas de billar para Billares Don Miguel.
publish_to: "none"
version: 1.2.9+129
# Disparador controlado para completar el refactor del flujo de cobro.
environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  apk_install: ^1.0.1
  flutter_background: ^1.3.1
  print_bluetooth_thermal: ^1.2.4
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tv-logo.webp
