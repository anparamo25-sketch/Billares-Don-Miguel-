<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billares Don Miguel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.wrap{width:100%;max-width:none;margin:0;padding:0 22px 24px}header{min-height:112px;padding:14px 4px;background:#fff;border-bottom:3px solid #1557c0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brandLogo{justify-self:start;display:flex;align-items:center;gap:10px;color:#1557c0;font-weight:900}.mark{width:58px;height:58px;border:3px solid #1557c0;border-radius:13px;display:grid;place-items:center;font-size:20px;letter-spacing:-1px}.word{font-size:18px}.brandTitle{justify-self:center}.brandTitle h1{margin:0;font-size:clamp(32px,4.5vw,54px);line-height:1;color:#1557c0;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.18)}.liveBox{justify-self:end;text-align:center;color:#1557c0}.clock{font-size:clamp(18px,2vw,28px);font-weight:900;line-height:1.1}.live{font-size:clamp(16px,1.8vw,25px);font-weight:900;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;padding:22px 0}.card{border-radius:18px;padding:20px;border:3px solid #64748b;min-height:305px;display:flex;flex-direction:column;box-shadow:0 8px 18px rgba(0,0,0,.25)}.green{background:#103b22;border-color:#22c55e}.red{background:#511b1b;border-color:#ef4444}.yellow{background:#56490a;border-color:#eab308}.num{font-size:clamp(24px,2.7vw,38px);font-weight:900}.status{font-size:clamp(18px,2vw,27px);font-weight:900;margin:7px 0 13px}.green .status{color:#4ade80}.red .status{color:#f87171}.yellow .status{color:#fde047}.rate{font-size:clamp(17px,1.7vw,24px);font-weight:900;margin-bottom:10px}.line{font-size:clamp(17px,1.65vw,23px);font-weight:700;line-height:1.35;margin:5px 0}.pay{margin-top:auto;padding-top:13px;border-top:2px solid rgba(255,255,255,.25)}.payLabel{font-size:clamp(15px,1.5vw,21px);font-weight:900;letter-spacing:.5px}.money{font-size:clamp(30px,3.2vw,46px);font-weight:900;margin-top:3px}.empty{text-align:center;padding:30px;font-size:20px}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){header{grid-template-columns:auto 1fr auto}.word{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:270px;padding:16px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.brandTitle h1{font-size:28px}.mark{width:46px;height:46px}.clock{font-size:15px}.live{font-size:15px}}
</style>
</head>
<body>
<main class="wrap">
<header>
<div class="brandLogo"><div class="mark">BDM</div><div class="word">BILLARES</div></div>
<div class="brandTitle"><h1>Billares Don Miguel</h1></div>
<div class="liveBox"><div id="clock" class="clock">--:-- PM</div><div class="live">🟢 EN VIVO</div></div>
</header>
<section id="tables" class="grid"></section>
</main>
<script>
const rates={1:120,2:120,3:100,4:100,5:70};let state={};
function safe(v){return v==null||v===''?'—':String(v)}
function money(v){return 'C$ '+Number(v||0).toFixed(2)}
function render(){const root=document.getElementById('tables');root.innerHTML='';for(let i=1;i<=5;i++){const t=state[i]||{status:'Disponible',rate:rates[i],amount:0};const cls=t.status==='En juego'?'red':t.status==='Pendiente de cobro'?'yellow':'green';root.innerHTML+=`<article class="card ${cls}"><div class="num">Mesa ${i}</div><div class="status">${safe(t.status||'Disponible')}</div><div class="rate">Tarifa por hora: ${money(t.rate??rates[i])}</div><div class="line"><b>Hora de inicio:</b> ${safe(t.start)}</div><div class="line"><b>Tiempo jugado:</b> ${safe(t.elapsed)}</div><div class="line"><b>Hora finalizada:</b> ${safe(t.end)}</div><div class="pay"><div class="payLabel">MONTO A PAGAR</div><div class="money">${money(t.amount)}</div></div></article>`}}
function connect(){const protocol=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(protocol+'//'+location.host+'/ws');ws.onopen=()=>{updateClock()};ws.onmessage=e=>{try{state=JSON.parse(e.data);render()}catch(_){}};ws.onclose=()=>setTimeout(connect,3000)}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}render();updateClock();setInterval(updateClock,1000);connect();
</script>
</body>
</html>
