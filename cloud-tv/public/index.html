<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Billares Don Miguel - TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif}.wrap{width:100%;height:100vh;padding:0 20px 16px;display:flex;flex-direction:column;overflow:hidden}header{height:118px;flex:0 0 118px;padding:10px 8px;background:#fff;border-bottom:3px solid #1557c0;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center}.title{justify-self:start;color:#1557c0;font-size:clamp(28px,3.3vw,48px);font-weight:900;line-height:1.05;letter-spacing:.3px}.logoWrap{justify-self:center;height:108px;width:min(190px,18vw);display:flex;align-items:center;justify-content:center}.logoWrap img{width:100%;height:100%;object-fit:contain;display:block}.liveBox{justify-self:end;text-align:center;color:#1557c0}.clock{font-size:clamp(20px,2.2vw,32px);font-weight:900;line-height:1.1}.live{font-size:clamp(17px,1.9vw,25px);font-weight:900;margin-top:6px}.grid{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:14px 0 0;overflow:hidden}.card{height:100%;min-height:0;border-radius:18px;padding:16px;border:3px solid #64748b;display:flex;flex-direction:column;box-shadow:0 8px 18px rgba(0,0,0,.28);overflow:hidden}.green{background:#103b22;border-color:#22c55e}.red{background:#511b1b;border-color:#ef4444}.yellow{background:#56490a;border-color:#eab308}.num{font-size:clamp(24px,2.7vw,38px);font-weight:900;line-height:1.05}.status{font-size:clamp(18px,2vw,27px);font-weight:900;margin:7px 0 10px;line-height:1.05}.green .status{color:#4ade80}.red .status{color:#f87171}.yellow .status{color:#fde047}.line{font-size:clamp(18px,1.75vw,25px);font-weight:700;line-height:1.28;margin:7px 0}.line b{font-weight:900}.pay{margin-top:auto;padding-top:12px;border-top:2px solid rgba(255,255,255,.25)}.payLabel{font-size:clamp(16px,1.6vw,22px);font-weight:900;letter-spacing:.5px}.money{font-size:clamp(31px,3.3vw,48px);font-weight:900;margin-top:4px;line-height:1.05;color:#fde047}@media(max-height:700px){header{height:96px;flex-basis:96px}.wrap{padding:0 14px 10px}.logoWrap{height:88px}.grid{gap:10px;padding-top:10px}.card{padding:12px;border-radius:14px}.status{margin:5px 0 8px}.line{font-size:clamp(15px,1.6vw,21px);margin:4px 0}.pay{padding-top:8px}}@media(max-width:1100px){header{grid-template-columns:1fr 1fr 1fr}.title{font-size:clamp(22px,3vw,36px)}.logoWrap{width:min(155px,20vw)}}
</style>
</head>
<body>
<main class="wrap">
<header>
<div class="title">Billares Don Miguel</div>
<div class="logoWrap"><img src="/tv-logo.webp" alt="Billares Don Miguel"></div>
<div class="liveBox"><div id="clock" class="clock">--:-- PM</div><div class="live">🟢 EN VIVO</div></div>
</header>
<section id="tables" class="grid"></section>
</main>
<script>
const rates={1:120,2:120,3:100,4:100,5:70};let lastState=null,ws=null,reconnectTimer=null,pollingTimer=null;
function safe(v){return v==null||v===''?'—':String(v)}
function money(v){return 'C$ '+Number(v||0).toFixed(2)}
function clockValue(v){if(!v)return '—';var d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}
function elapsedValue(t){if(t&&t.elapsed&&t.elapsed!=='00:00:00')return t.elapsed;if(!t||!t.start)return '00:00:00';var a=new Date(t.start),b=t.end?new Date(t.end):new Date();if(isNaN(a.getTime())||isNaN(b.getTime()))return '00:00:00';var sec=Math.max(0,Math.floor((b-a)/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function statusName(v){return v==='playing'?'En juego':v==='pending'?'Pendiente de cobro':v==='available'?'Disponible':safe(v)}
function render(d){lastState=d||lastState||{};var tables=Array.isArray(lastState.tables)?lastState.tables:[];document.getElementById('tables').innerHTML=[1,2,3,4,5].map(function(i){var t=tables.find(function(x){return Number(x.number)===i})||{number:i,status:'available',rate:rates[i],amount:0};var s=statusName(t.status),c=s==='En juego'?'red':s==='Pendiente de cobro'?'yellow':'green';return '<article class="card '+c+'"><div class="num">Mesa '+i+'</div><div class="status">'+safe(s)+'</div><div class="line"><b>Hora de inicio:</b> '+(t.start&&String(t.start).indexOf('T')>0?clockValue(t.start):safe(t.start))+'</div><div class="line"><b>Tiempo jugado:</b> '+elapsedValue(t)+'</div><div class="line"><b>Hora finalizada:</b> '+(t.end&&String(t.end).indexOf('T')>0?clockValue(t.end):safe(t.end))+'</div><div class="pay"><div class="payLabel">MONTO A PAGAR</div><div class="money">'+money(t.amount)+'</div></div></article>'}).join('');var clock=document.getElementById('clock');if(clock)clock.textContent=new Date().toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}
async function pollState(){try{var r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){}}
function startPolling(){if(pollingTimer)return;pollState();pollingTimer=setInterval(pollState,1000)}
function connect(){clearTimeout(reconnectTimer);try{if(ws)ws.close()}catch(e){}var p=location.protocol==='https:'?'wss:':'ws:';try{ws=new WebSocket(p+'//'+location.host+'/api/stream');ws.onopen=function(){if(pollingTimer){clearInterval(pollingTimer);pollingTimer=null}};ws.onmessage=function(e){try{render(JSON.parse(e.data))}catch(_){}};ws.onclose=function(){startPolling();reconnectTimer=setTimeout(connect,3000)};ws.onerror=function(){try{ws.close()}catch(_){};startPolling()}}catch(e){startPolling();reconnectTimer=setTimeout(connect,3000)}}
render({tables:[]});connect();setInterval(function(){if(lastState)render(lastState)},1000);
</script>
</body>
</html>
