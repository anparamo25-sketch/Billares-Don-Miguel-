<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Billares Don Miguel - TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif}
.wrap{width:100%;height:100vh;padding:0 12px 9px;display:flex;flex-direction:column;overflow:hidden}
header{height:78px;flex:0 0 78px;padding:5px 7px;background:#fff;border-bottom:3px solid #1557c0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.title{justify-self:start;color:#1557c0;font-size:clamp(22px,3vw,38px);font-weight:900;line-height:1.02;letter-spacing:.2px}.logoWrap{display:none}.liveBox{justify-self:end;text-align:center;color:#1557c0}.clock{font-size:clamp(17px,1.8vw,25px);font-weight:900;line-height:1.05}.live{font-size:clamp(14px,1.5vw,21px);font-weight:900;margin-top:3px}
.grid{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:8px 0 0;overflow:hidden}
.card{height:100%;min-height:0;border-radius:12px;padding:10px 9px 8px;border:3px solid #64748b;display:flex;flex-direction:column;box-shadow:0 5px 12px rgba(0,0,0,.28);overflow:hidden}
.green{background:#103b22;border-color:#22c55e}.red{background:#511b1b;border-color:#ef4444}.yellow{background:#56490a;border-color:#eab308}
.num{font-size:clamp(22px,2.35vw,33px);font-weight:900;line-height:1.02}.status{font-size:clamp(15px,1.5vw,21px);font-weight:900;margin:4px 0 6px;line-height:1.02}.green .status{color:#4ade80}.red .status{color:#f87171}.yellow .status{color:#fde047}
.rate{font-size:clamp(15px,1.45vw,20px);font-weight:900;line-height:1.05;margin:0 0 6px}.line{font-size:clamp(14px,1.4vw,19px);font-weight:700;line-height:1.16;margin:3px 0}.line b{font-weight:900}
.pay{margin-top:auto;padding-top:7px;border-top:2px solid rgba(255,255,255,.3);text-align:center}.payLabel{font-size:clamp(13px,1.25vw,18px);font-weight:900;letter-spacing:.4px}.money{font-size:clamp(27px,2.8vw,41px);font-weight:900;margin-top:2px;line-height:1.02;color:#fde047}
@media(max-height:700px){header{height:68px;flex-basis:68px;padding:4px 6px}.wrap{padding:0 9px 6px}.grid{gap:6px;padding-top:6px}.card{padding:8px 7px 6px;border-radius:10px}.status{margin:3px 0 5px}.rate{margin-bottom:4px}.line{font-size:clamp(13px,1.3vw,17px);margin:2px 0}.pay{padding-top:5px}.payLabel{font-size:12px}.money{font-size:clamp(24px,2.6vw,37px)}}
@media(max-width:1100px){.grid{gap:6px}.card{padding-left:7px;padding-right:7px}}
</style>
</head>
<body>
<main class="wrap">
<header>
<div class="title">Billares Don Miguel</div>
<div class="logoWrap"><img src="/tv-logo.webp" alt="Billares Don Miguel"></div>
<div class="liveBox"><div id="clock" class="clock">--:-- PM</div><div class="live">🟢 EN VIVO</div></div>
</header>
<section id="tables" class="grid"></section>
</main>
<script>
const rates={1:120,2:120,3:100,4:100,5:70};let lastState=null,ws=null,reconnectTimer=null,pollingTimer=null;
function safe(v){return v==null||v===''?'—':String(v)}
function money(v){return v==null||v===''?'—':'C$ '+Math.round(Number(v)||0)}
function clockValue(v){if(!v)return '—';var d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}
function elapsedValue(t){if(t&&t.elapsed&&t.elapsed!=='00:00:00')return t.elapsed;if(!t||!t.start)return '00:00:00';var a=new Date(t.start),b=t.end?new Date(t.end):new Date();if(isNaN(a.getTime())||isNaN(b.getTime()))return '00:00:00';var sec=Math.max(0,Math.floor((b-a)/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function statusName(v){return v==='playing'?'En juego':v==='pending'?'Pendiente de cobro':v==='available'?'Disponible':safe(v)}
function render(d){lastState=d||lastState||{};var tables=Array.isArray(lastState.tables)?lastState.tables:[];document.getElementById('tables').innerHTML=[1,2,3,4,5].map(function(i){var t=tables.find(function(x){return Number(x.number)===i})||{number:i,status:'available',rate:rates[i],amount:null};var s=statusName(t.status),c=s==='En juego'?'red':s==='Pendiente de cobro'?'yellow':'green';var totalLabel=s==='En juego'?'TOTAL ACTUAL':'TOTAL A PAGAR';return '<article class="card '+c+'"><div class="num">Mesa '+i+'</div><div class="status">'+safe(s)+'</div><div class="rate">Tarifa: '+money(t.rate??rates[i])+' / hora</div><div class="line"><b>Inicio:</b> '+(t.start&&String(t.start).indexOf('T')>0?clockValue(t.start):safe(t.start))+'</div><div class="line"><b>Tiempo jugado:</b> '+elapsedValue(t)+'</div><div class="line"><b>Finalización:</b> '+(t.end&&String(t.end).indexOf('T')>0?clockValue(t.end):safe(t.end))+'</div><div class="pay"><div class="payLabel">'+totalLabel+'</div><div class="money">'+money(t.amount)+'</div></div></article>'}).join('');var clock=document.getElementById('clock');if(clock)clock.textContent=new Date().toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}
async function pollState(){try{var r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){}}
function startPolling(){if(pollingTimer)return;pollState();pollingTimer=setInterval(pollState,1000)}
function connect(){clearTimeout(reconnectTimer);try{if(ws)ws.close()}catch(e){}var p=location.protocol==='https:'?'wss:':'ws:';try{ws=new WebSocket(p+'//'+location.host+'/api/stream');ws.onopen=function(){if(pollingTimer){clearInterval(pollingTimer);pollingTimer=null}};ws.onmessage=function(e){try{render(JSON.parse(e.data))}catch(_){}};ws.onclose=function(){startPolling();reconnectTimer=setTimeout(connect,3000)};ws.onerror=function(){try{ws.close()}catch(_){};startPolling()}}catch(e){startPolling();reconnectTimer=setTimeout(connect,3000)}}
render({tables:[]});connect();setInterval(function(){if(lastState)render(lastState)},1000);
</script>
</body>
</html>
