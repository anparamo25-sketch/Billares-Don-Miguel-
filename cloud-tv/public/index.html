<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Billares Don Miguel - TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif}
.wrap{width:100%;height:100vh;padding:0 10px 7px;display:flex;flex-direction:column;overflow:hidden}
header{height:68px;flex:0 0 68px;padding:4px 7px;background:#fff;border-bottom:3px solid #1557c0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.title{justify-self:start;color:#1557c0;font-size:clamp(23px,3vw,38px);font-weight:900;line-height:1.02;letter-spacing:.2px}.logoWrap{display:none}.liveBox{justify-self:end;text-align:center;color:#1557c0}.clock{font-size:clamp(18px,1.9vw,26px);font-weight:900;line-height:1.05}.live{font-size:clamp(14px,1.55vw,21px);font-weight:900;margin-top:2px}
.grid{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:7px 0 0;overflow:hidden}
.card{--scale:1;height:100%;min-height:0;min-width:0;border-radius:10px;padding:calc(11px * var(--scale)) calc(9px * var(--scale));border:3px solid #64748b;display:flex;flex-direction:column;box-shadow:0 4px 10px rgba(0,0,0,.28);overflow:hidden;justify-content:flex-start}
.green{background:#103b22;border-color:#22c55e}.red{background:#511b1b;border-color:#ef4444}.yellow{background:#56490a;border-color:#eab308}
.num{font-size:calc(30px * var(--scale));font-weight:900;line-height:1.05;white-space:nowrap}.status{font-size:calc(20px * var(--scale));font-weight:900;margin:calc(8px * var(--scale)) 0 calc(7px * var(--scale));line-height:1.05;white-space:nowrap}.green .status{color:#4ade80}.red .status{color:#f87171}.yellow .status{color:#fde047}
.rate{font-size:calc(18px * var(--scale));font-weight:900;line-height:1.05;margin:0 0 calc(10px * var(--scale));white-space:nowrap}.line{font-size:calc(17px * var(--scale));font-weight:700;line-height:1.12;margin:calc(6px * var(--scale)) 0;white-space:nowrap}.line b{font-weight:900}
.pay{margin-top:auto;padding-top:calc(9px * var(--scale));border-top:2px solid rgba(255,255,255,.3);text-align:center;flex:0 0 auto}.payLabel{font-size:calc(16px * var(--scale));font-weight:900;letter-spacing:.3px;white-space:nowrap}.money{font-size:calc(40px * var(--scale));font-weight:900;margin-top:4px;line-height:1.02;color:#fde047;white-space:nowrap}
/* La escala aprovecha el espacio vertical disponible y conserva las cinco tarjetas. */
@media(max-height:700px){header{height:58px;flex-basis:58px;padding:3px 5px}.wrap{padding:0 7px 5px}.grid{gap:5px;padding-top:5px}}
@media(max-width:900px){header{height:56px;flex-basis:56px}.wrap{padding:0 6px 5px}.grid{gap:4px;padding-top:4px}.title{font-size:clamp(18px,4vw,28px)}.clock{font-size:clamp(15px,2.8vw,22px)}.live{font-size:clamp(12px,2.2vw,18px)}}
</style>
</head>
<body>
<main class="wrap">
<header>
<div class="title">Billares Don Miguel</div>
<div class="logoWrap"><img src="/tv-logo.webp" alt="Billares Don Miguel"></div>
<div class="liveBox"><div id="clock" class="clock">--:-- PM</div><div class="live">🟢 EN VIVO</div></div>
</header>
<section id="tables" class="grid"></section>
</main>
<script>
const rates={1:120,2:120,3:100,4:100,5:70};let lastState=null,ws=null,reconnectTimer=null,pollingTimer=null;
function safe(v){return v==null||v===''?'—':String(v)}
function money(v){return v==null||v===''?'—':'C$ '+Math.round(Number(v)||0)}
function clockValue(v){if(!v)return '—';var d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}
function elapsedValue(t){if(t&&t.elapsed&&t.elapsed!=='00:00:00')return t.elapsed;if(!t||!t.start)return '00:00:00';var a=new Date(t.start),b=t.end?new Date(t.end):new Date();if(isNaN(a.getTime())||isNaN(b.getTime()))return '00:00:00';var sec=Math.max(0,Math.floor((b-a)/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function statusName(v){return v==='playing'?'En juego':v==='pending'?'Pendiente de cobro':v==='available'?'Disponible':safe(v)}
function fitCards(){var grid=document.getElementById('tables');if(!grid)return;var cards=grid.querySelectorAll('.card');if(!cards.length)return;var w=grid.clientWidth/5;var h=grid.clientHeight;var scale=Math.min(w/245,h/255);scale=Math.max(.72,Math.min(1.5,scale));cards.forEach(function(card){card.style.setProperty('--scale',scale.toFixed(3))})}
function render(d){lastState=d||lastState||{};var tables=Array.isArray(lastState.tables)?lastState.tables:[];document.getElementById('tables').innerHTML=[1,2,3,4,5].map(function(i){var t=tables.find(function(x){return Number(x.number)===i})||{number:i,status:'available',rate:rates[i],amount:null};var s=statusName(t.status),c=s==='En juego'?'red':s==='Pendiente de cobro'?'yellow':'green';var totalLabel=s==='En juego'?'TOTAL ACTUAL':'TOTAL A PAGAR';return '<article class="card '+c+'"><div class="num">Mesa '+i+'</div><div class="status">'+safe(s)+'</div><div class="rate">Tarifa: '+money(t.rate??rates[i])+' / hora</div><div class="line"><b>Inicio:</b> '+(t.start&&String(t.start).indexOf('T')>0?clockValue(t.start):safe(t.start))+'</div><div class="line"><b>Tiempo jugado:</b> '+elapsedValue(t)+'</div><div class="line"><b>Finalización:</b> '+(t.end&&String(t.end).indexOf('T')>0?clockValue(t.end):safe(t.end))+'</div><div class="pay"><div class="payLabel">'+totalLabel+'</div><div class="money">'+money(t.amount)+'</div></div></article>'}).join('');fitCards();var clock=document.getElementById('clock');if(clock)clock.textContent=new Date().toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit',hour12:true})}
async function pollState(){try{var r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){}}
function startPolling(){if(pollingTimer)return;pollState();pollingTimer=setInterval(pollState,1000)}
function connect(){clearTimeout(reconnectTimer);try{if(ws)ws.close()}catch(e){}var p=location.protocol==='https:'?'wss:':'ws:';try{ws=new WebSocket(p+'//'+location.host+'/api/stream');ws.onopen=function(){if(pollingTimer){clearInterval(pollingTimer);pollingTimer=null}};ws.onmessage=function(e){try{render(JSON.parse(e.data))}catch(_){}};ws.onclose=function(){startPolling();reconnectTimer=setTimeout(connect,3000)};ws.onerror=function(){try{ws.close()}catch(_){};startPolling()}}catch(e){startPolling();reconnectTimer=setTimeout(connect,3000)}}
render({tables:[]});connect();setInterval(function(){if(lastState)render(lastState)},1000);window.addEventListener('resize',fitCards);if(window.ResizeObserver){new ResizeObserver(fitCards).observe(document.getElementById('tables'))}
</script>
</body>
</html>
