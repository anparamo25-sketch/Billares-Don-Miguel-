<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billares Don Miguel</title><style>body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.brand{font-size:clamp(28px,4vw,52px);font-weight:800;color:#1e90ff;text-shadow:2px 2px 0 #fff;text-align:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#111d2e;border:2px solid #263c56;border-radius:18px;padding:20px;min-height:230px;box-sizing:border-box}.num{font-size:28px;font-weight:800}.status{font-weight:800;margin:14px 0}.green{color:#35e06f}.red{color:#ff5252}.yellow{color:#ffd43b}.info{color:#cbd5e1;line-height:1.7}.amount{font-size:30px;font-weight:800;margin-top:12px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">Billares Don Miguel</div><section id="tables" class="grid"></section></main><script>const names={1:120,2:120,3:100,4:100,5:70};let state={};function render(){const root=document.getElementById('tables');root.innerHTML='';for(let i=1;i<=5;i++){const t=state[i]||{status:'Disponible'};const cls=t.status==='En juego'?'red':t.status==='Pendiente de cobro'?'yellow':'green';root.innerHTML+=`<article class="card"><div class="num">Mesa ${i}</div><div class="status ${cls}">${t.status||'Disponible'}</div><div class="info">${t.start?'Inicio: '+t.start+'<br>Tiempo: '+(t.elapsed||'0 min')+'<br>Fin: '+(t.end||'—'): 'Lista para jugar'}</div><div class="amount">C$ ${Number(t.amount||0).toFixed(2)}</div></article>`}}function connect(){const p=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(p+'//'+location.host+'/ws');ws.onmessage=e=>{try{state=JSON.parse(e.data);render()}catch(_){}};ws.onclose=()=>setTimeout(connect,3000)}render();connect();</script></body></html>
