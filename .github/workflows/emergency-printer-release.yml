name: Emergency printer fix APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - name: Apply printer source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """      if (!await PrintBluetoothThermal.bluetoothEnabled) {
        if (mounted) {
          await showDialog<void>(
            context: context,
            builder:
                (BuildContext dialogContext) => AlertDialog(
                  title: const Text('Bluetooth desactivado'),
                  content: const Text(
                    'Activa Bluetooth en la tablet y vuelve a pulsar Configurar impresora térmica.',
                  ),
                  actions: <Widget>[
                    FilledButton(
                      onPressed: () => Navigator.pop(dialogContext),
                      child: const Text('Cerrar'),
                    ),
                  ],
                ),
          );
        }
        return false;
      }
      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
"""
          new = """      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
"""
          if old not in s:
              raise SystemExit('No se encontro el bloqueo Bluetooth incorrecto.')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          a = s.index('Future<bool> configureThermalPrinter() async {')
          b = s.index('Future<String?> printReceipt', a)
          block = s[a:b]
          assert 'PrintBluetoothThermal.bluetoothEnabled' not in block
          assert 'PrintBluetoothThermal.pairedBluetooths' in block
          print('THERMAL_PRINTER_SOURCE_FIX=OK')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release --no-shrink --build-name=1.2.9 --build-number=129
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Billares-Don-Miguel-printer-fix-v1.2.9-build129.apk
          sha256sum "$APK" | tee dist/SHA256SUM.txt
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-printer-fix-v1.2.9-build129
          path: dist/*
          if-no-files-found: error
          retention-days: 30
