name: One-time thermal receipt header correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Correct only the 48mm thermal headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          target = """'Billares Don Miguel',\n          styles: const PosStyles(\n            align: PosAlign.center,\n            bold: true,\n            height: PosTextSize.size2,\n            width: PosTextSize.size2,"""
          if s.count(target) != 2:
              raise SystemExit(f'Se esperaban exactamente 2 encabezados térmicos de Billares Don Miguel; encontrados: {s.count(target)}')
          changed = s.replace('height: PosTextSize.size2,\n            width: PosTextSize.size2,', 'height: PosTextSize.size1,\n            width: PosTextSize.size1,')
          if changed == s:
              raise SystemExit('No se realizó ningún cambio en main.dart')
          p.write_text(changed, encoding='utf-8')
          PY
          dart format lib/main.dart
          grep -q "height: PosTextSize.size1" lib/main.dart
          grep -q "width: PosTextSize.size1" lib/main.dart
          git diff --check

      - name: Commit source correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-receipt-header-fix.yml
          git add lib/main.dart
          git commit -m 'fix: fit thermal receipt business name within 48mm'
          git push origin HEAD:main

# Trigger revision: 48mm thermal header source correction
