name: Apply total rounding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[rounding-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4

      - name: Aplicar redondeo permanente del total
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          old = "table.amount = table.liveAmount;"
          new = "table.amount = table.liveAmount.roundToDouble();"
          if text.count(old) != 1:
              raise SystemExit(f'No se encontro exactamente una asignacion final del total: {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = "String money(double value) => 'C\\$${value.toStringAsFixed(2)}';"
          helper = "String money(double value) => 'C\\$${value.toStringAsFixed(2)}';\n\n  String totalMoney(double value) => 'C\\$${value.round()}';"
          if text.count(marker) != 1:
              raise SystemExit(f'No se encontro exactamente la funcion money: {text.count(marker)}')
          text = text.replace(marker, helper, 1)

          targeted = {
              "amountText: money(table.amount),": "amountText: totalMoney(table.amount),",
              "money(amount),": "totalMoney(amount),",
              "money(table.amount),": "totalMoney(table.amount),",
              "money(e.amount)": "totalMoney(e.amount)",
          }
          for old_value, new_value in targeted.items():
              if old_value not in text:
                  raise SystemExit(f'No se encontro el patron esperado: {old_value}')
              text = text.replace(old_value, new_value)

          pattern = r"base64Decode\(\s*'([^']+)'\s*,\s*\)"
          match = re.search(pattern, text, re.S)
          if not match:
              raise SystemExit('No se encontro la plantilla HTML TV codificada')
          html = base64.b64decode(match.group(1)).decode('utf-8')
          if "toFixed(2)" not in html:
              raise SystemExit('La plantilla TV no contiene el formateo esperado del monto')
          html = html.replace('toFixed(2)', 'toFixed(0)')
          encoded = base64.b64encode(html.encode('utf-8')).decode('ascii')
          text = text[:match.start(1)] + encoded + text[match.end(1):]

          path.write_text(text, encoding='utf-8')

      - name: Verificar cambio fuente
        run: |
          grep -n "table.amount = table.liveAmount.roundToDouble();" lib/main.dart
          grep -n "String totalMoney" lib/main.dart

      - name: Commit y eliminar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm .github/workflows/apply-total-rounding.yml
          git commit -m "fix: redondear total final a numero entero [rounding-applied]"
          git push
