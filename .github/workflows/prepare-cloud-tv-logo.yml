name: Prepare Cloud TV logo

on:
  push:
    paths:
      - 'cloud-tv/DEPLOY_TRIGGER_2026-09-12.txt'
      - 'cloud-tv/public/index.html'
      - '.github/workflows/prepare-cloud-tv-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Convert official TV logo to PNG
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            magick cloud-tv/public/tv-logo.webp cloud-tv/public/tv-logo.png
          elif command -v convert >/dev/null 2>&1; then
            convert cloud-tv/public/tv-logo.webp cloud-tv/public/tv-logo.png
          elif command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -i cloud-tv/public/tv-logo.webp cloud-tv/public/tv-logo.png
          else
            echo "No compatible image converter is available on the runner"
            exit 1
          fi
          file cloud-tv/public/tv-logo.png
          test -s cloud-tv/public/tv-logo.png

      - name: Force Cloud TV to use the local PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('cloud-tv/public/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<img id="tvLogo"[^>]*>', '<img id="tvLogo" src="/tv-logo.png" alt="Billares Don Miguel">', s)
          s = s.replace("this.src='/tv-logo.webp?v=3'", "this.src='/tv-logo.png'")
          s = s.replace("this.src='/tv-logo.webp?v=2'", "this.src='/tv-logo.png'")
          p.write_text(s, encoding='utf-8')
          PY
          grep -o 'src="/tv-logo.png"' cloud-tv/public/index.html

      - name: Commit generated PNG and source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-tv/public/tv-logo.png cloud-tv/public/index.html
          if git diff --cached --quiet; then
            echo "TV logo files already current"
          else
            git commit -m "Add converted Cloud TV PNG logo"
            git push
          fi
