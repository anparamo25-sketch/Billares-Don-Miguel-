name: Prepare Cloud TV logo

# Cloud TV: preserve and publish the exact original PNG logo. No WebP conversion and no image resizing.

on:
  push:
    paths:
      - 'cloud-tv/public/index.html'
      - 'cloud-tv/public/tv-logo.png'
      - '.github/workflows/prepare-cloud-tv-logo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact original PNG logo
        shell: bash
        run: |
          set -euo pipefail
          test -s cloud-tv/public/tv-logo.png
          file cloud-tv/public/tv-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('cloud-tv/public/tv-logo.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Logo is not a valid PNG')
          if len(data) < 24 or data[12:16] != b'IHDR':
              raise SystemExit('PNG IHDR is missing')
          width, height = struct.unpack('>II', data[16:24])
          print(f'Exact PNG present: {p} ({len(data)} bytes, {width}x{height})')
          PY

      - name: Verify Cloud TV references PNG
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="/tv-logo.png"' cloud-tv/public/index.html
          grep -q 'class="cardLogo" src="/tv-logo.png"' cloud-tv/public/index.html
          echo 'Cloud TV title bar and table cards reference the PNG logo.'
