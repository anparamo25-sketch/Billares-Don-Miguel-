name: Prepare Cloud TV logo

# Cloud TV deployment refresh: preserve the correct original PNG and trigger the hosting redeploy.

on:
  push:
    paths:
      - 'cloud-tv/DEPLOY_TRIGGER_2026-09-12.txt'
      - 'cloud-tv/public/index.html'
      - 'cloud-tv/public/tv-logo.png'
      - '.github/workflows/prepare-cloud-tv-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore the correct original PNG logo without WebP conversion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 3f28f366c2626b3f231527c08c5109b869776c95
          git checkout 3f28f366c2626b3f231527c08c5109b869776c95 -- cloud-tv/public/tv-logo.png
          test -s cloud-tv/public/tv-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('cloud-tv/public/tv-logo.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Original file is not a valid PNG')
          w, h = struct.unpack('>II', data[16:24])
          print(f'Correct original PNG source: {p} ({len(data)} bytes, {w}x{h})')
          PY

      - name: Prepare 1024x1024 PNG from the correct original artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('cloud-tv/public/tv-logo.png')
          im = Image.open(p).convert('RGBA')
          if im.size != (1024, 1024):
              im = im.resize((1024, 1024), Image.Resampling.LANCZOS)
          im.save(p, format='PNG', optimize=True)
          check = Image.open(p)
          if check.size != (1024, 1024) or check.format != 'PNG':
              raise SystemExit('Final logo is not a 1024x1024 PNG')
          print(f'Final Cloud TV logo: {p} ({check.size[0]}x{check.size[1]}, PNG)')
          PY

      - name: Force Cloud TV to use the local PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('cloud-tv/public/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<img id="tvLogo"[^>]*>', '<img id="tvLogo" src="/tv-logo.png" alt="Billares Don Miguel" loading="eager" decoding="sync">', s, count=1)
          s = re.sub(r"this\.src='/tv-logo\.webp[^']*'", "this.src='/tv-logo.png'", s)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'src="/tv-logo.png"' cloud-tv/public/index.html

      - name: Commit correct PNG logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-tv/public/tv-logo.png cloud-tv/public/index.html
          if git diff --cached --quiet; then
            echo "TV logo already current"
          else
            git commit -m "Use correct original PNG logo in Cloud TV"
            git push
          fi
