name: Prepare Cloud TV logo

on:
  push:
    paths:
      - 'cloud-tv/DEPLOY_TRIGGER_2026-09-12.txt'
      - 'cloud-tv/public/index.html'
      - 'cloud-tv/public/tv-logo.png'
      - '.github/workflows/prepare-cloud-tv-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore the original PNG logo without conversion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 88d5c19ac93916f8be7bc659b645c310061bf72a
          git checkout 88d5c19ac93916f8be7bc659b645c310061bf72a -- cloud-tv/public/tv-logo.png
          test -s cloud-tv/public/tv-logo.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloud-tv/public/tv-logo.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Original file is not a valid PNG')
          print(f'Original PNG preserved: {p} ({len(data)} bytes)')
          PY

      - name: Force Cloud TV to use the local PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('cloud-tv/public/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<img id="tvLogo"[^>]*>', '<img id="tvLogo" src="/tv-logo.png" alt="Billares Don Miguel" loading="eager" decoding="sync">', s, count=1)
          s = re.sub(r"this\.src='/tv-logo\.webp[^']*'", "this.src='/tv-logo.png'", s)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'src="/tv-logo.png"' cloud-tv/public/index.html

      - name: Commit preserved PNG and source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-tv/public/tv-logo.png cloud-tv/public/index.html
          if git diff --cached --quiet; then
            echo "TV logo files already current"
          else
            git commit -m "Restore original PNG logo for Cloud TV"
            git push
          fi
