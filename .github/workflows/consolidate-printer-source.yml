name: Correccion directa fuente 1.2.9

on: push

permissions:
  contents: write

jobs:
  correct-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Corregir directamente lib/main.dart
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          if 'Future<bool> configureThermalPrinter() async {' not in s:
              raise SystemExit('ERROR: falta configureThermalPrinter en la fuente')

          old = '''                FilledButton.icon(
                  onPressed: showTvConnection,
                  icon: const Icon(Icons.tv),
                  label: const Text('Mostrar en TV'),
                ),
                OutlinedButton.icon(
                  onPressed: checkForUpdate,
                  icon: const Icon(Icons.system_update_alt),
                  label: const Text('Buscar actualización'),
                ),'''

          new = '''                OutlinedButton.icon(
                  onPressed: configureThermalPrinter,
                  icon: const Icon(Icons.print_outlined),
                  label: const Text('Configurar impresora térmica'),
                ),
                OutlinedButton.icon(
                  onPressed: checkForUpdate,
                  icon: const Icon(Icons.system_update_alt),
                  label: const Text('Buscar actualización'),
                ),'''

          if old not in s:
              if 'label: const Text(\'Configurar impresora térmica\')' not in s:
                  raise SystemExit('ERROR: no se encontró el bloque de interfaz que debe corregirse')
          else:
              s = s.replace(old, new, 1)

          if 'onPressed: showTvConnection' in s:
              raise SystemExit('ERROR: el botón Mostrar en TV sigue presente en la interfaz')
          if 'Compartir pantalla' in s or 'compartir pantalla' in s:
              raise SystemExit('ERROR: todavía existe una referencia a Compartir pantalla')
          if 'label: const Text(\'Configurar impresora térmica\')' not in s:
              raise SystemExit('ERROR: no quedó el botón Configurar impresora térmica')

          p.write_text(s, encoding='utf-8')
          PY

          flutter pub get
          dart format lib/main.dart
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test

      - name: Verificar correcciones permanentes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "Configurar impresora térmica" lib/main.dart
          ! grep -q "onPressed: showTvConnection" lib/main.dart
          ! grep -qi "Compartir pantalla" lib/main.dart
          grep -q "thermal_printer_mac" lib/main.dart
          grep -q "thermal_printer_name" lib/main.dart
          echo "Fuente 1.2.9/129 verificada: impresora visible y botón de compartir pantalla eliminado."

      - name: Guardar corrección directamente en main y retirar workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm .github/workflows/consolidate-printer-source.yml
          git commit -m "Corrige interfaz de impresora y elimina compartir pantalla"
          git push origin HEAD:main
