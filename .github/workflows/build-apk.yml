name: Billares Don Miguel - Release APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
  KNOWN_GOOD_APK_URL: https://github.com/anparamo25-sketch/Billares-Don-Miguel-/releases/download/v1.2.9-build353/Billares-Don-Miguel-latest.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Recover exact known-good APK from run 353
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 3 --retry-delay 2 "$KNOWN_GOOD_APK_URL" -o dist/Billares-Don-Miguel-latest.apk
          test -s dist/Billares-Don-Miguel-latest.apk
          cp dist/Billares-Don-Miguel-latest.apk "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Validate exact APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/Billares-Don-Miguel-latest.apk
          file "$APK"
          unzip -t "$APK" >/dev/null
          export PATH="${ANDROID_HOME}/build-tools/36.0.0:${PATH}"
          aapt dump badging "$APK" | grep -q "package: name='com.billaresdonmiguel.billares_don_miguel'"
          aapt dump badging "$APK" | grep -q "versionName='1.2.9'"
          aapt dump badging "$APK" | grep -q "versionCode='129'"
          apksigner verify --verbose "$APK"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct GitHub Release with both APK files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${BUILD_NAME}-build${{ github.run_number }}"
          gh release create "$TAG" --title "Billares Don Miguel v${BUILD_NAME} (build ${{ github.run_number }})" --notes "APK oficial basada exactamente en la versión funcional de la ejecución 353."
          gh release upload "$TAG" dist/Billares-Don-Miguel-latest.apk "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk" dist/SHA256SUMS.txt --clobber
