name: Billares Don Miguel - Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.29.3
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ]; then export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"; fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/opt/android-sdk}" /usr/local/lib/android/sdk /opt/hostedtoolcache -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then echo "ERROR: No se encontró sdkmanager en el runner de GitHub."; exit 1; fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          SDK_ROOT="${ANDROID_HOME:-/opt/android-sdk}"
          rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
          installed=0
          for attempt in 1 2 3; do
            echo "Instalación Android SDK/NDK, intento $attempt/3"
            if sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"; then
              if [ -d "$SDK_ROOT/ndk/${NDK_VERSION}" ]; then installed=1; break; fi
            fi
            rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
            sleep 3
          done
          if [ "$installed" -ne 1 ]; then echo "ERROR: No se pudo instalar NDK ${NDK_VERSION} después de 3 intentos."; exit 1; fi

      - name: Reparar archivo real del logo TV WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          source = Path('assets/tv-logo.webp')
          target = Path('cloud-tv/public/tv-logo.webp')
          rebuilt = Path('/tmp/tv-logo-rebuilt.webp')
          decoded = Path('/tmp/tv-logo-source.png')
          final = Path('/tmp/tv-logo-final.webp')

          data = source.read_bytes()
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit(f'{source}: no es un contenedor WebP RIFF válido')

          riff_size = struct.unpack_from('<I', data, 4)[0]
          riff_end = 8 + riff_size
          if riff_end > len(data):
              raise SystemExit(f'{source}: el tamaño RIFF declarado excede el archivo real')

          vp8 = data.find(b'VP8 ')
          if vp8 < 0 or vp8 + 8 > len(data):
              raise SystemExit(f'{source}: no contiene un chunk VP8')
          declared_chunk_size = struct.unpack_from('<I', data, vp8 + 4)[0]
          payload_start = vp8 + 8

          # El contenedor original tiene corrupto el tamaño declarado del chunk VP8.
          # El RIFF sí delimita correctamente el archivo y VP8 es el último chunk,
          # por lo que el bitstream válido termina exactamente en el final declarado
          # por RIFF. No se usa el tamaño corrupto del chunk para cortar el bitstream.
          payload_end = riff_end
          if payload_end <= payload_start or payload_end > len(data):
              raise SystemExit(f'{source}: límites inválidos para el bitstream VP8')
          payload = data[payload_start:payload_end]
          if len(payload) < 10 or payload[3:6] != b'\x9d\x01\x2a':
              raise SystemExit(f'{source}: bitstream VP8 interno no reconocido')

          raw_w = struct.unpack_from('<H', payload, 6)[0]
          raw_h = struct.unpack_from('<H', payload, 8)[0]
          width = raw_w & 0x3fff
          height = raw_h & 0x3fff
          if width <= 0 or height <= 0:
              raise SystemExit(f'{source}: dimensiones VP8 inválidas: {width}x{height}')
          print(f'VP8 recuperado: {width}x{height}; tamaño declarado corrupto={declared_chunk_size}; tamaño real={len(payload)}')

          # Reconstruir desde cero un contenedor RIFF/WEBP válido con el bitstream VP8 real.
          chunk = b'VP8 ' + struct.pack('<I', len(payload)) + payload
          if len(payload) & 1:
              chunk += b'\x00'
          riff_size_out = 4 + len(chunk)
          rebuilt.write_bytes(b'RIFF' + struct.pack('<I', riff_size_out) + b'WEBP' + chunk)

          # Decodificar el WebP reconstruido: elimina la corrupción del contenedor original.
          subprocess.run(['dwebp', str(rebuilt), '-o', str(decoded)], check=True)

          # Altura exacta de 90 px; cwebp calcula el ancho proporcionalmente.
          subprocess.run(['cwebp', '-quiet', '-resize', '0', '90', str(decoded), '-o', str(final)], check=True)
          shutil.copy2(final, source)
          shutil.copy2(final, target)

          print(f'Logo final generado proporcionalmente: {width}x{height} -> altura 90 px')
          PY

          webpinfo assets/tv-logo.webp
          webpinfo cloud-tv/public/tv-logo.webp
          test -s assets/tv-logo.webp
          test -s cloud-tv/public/tv-logo.webp
          cmp -s assets/tv-logo.webp cloud-tv/public/tv-logo.webp
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('assets/tv-logo.webp').read_bytes()
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('El logo final no tiene contenedor RIFF/WEBP válido')
          riff_size = struct.unpack_from('<I', data, 4)[0]
          if 8 + riff_size != len(data):
              raise SystemExit(f'El tamaño RIFF final no coincide: declarado={riff_size}, archivo={len(data)-8}')
          vp8 = data.find(b'VP8 ')
          if vp8 < 0 or vp8 + 8 > len(data):
              raise SystemExit('El logo final no contiene chunk VP8 válido')
          chunk_size = struct.unpack_from('<I', data, vp8 + 4)[0]
          payload_start = vp8 + 8
          payload_end = payload_start + chunk_size
          if payload_end > len(data):
              raise SystemExit('El chunk VP8 final excede el archivo')
          payload = data[payload_start:payload_end]
          w = struct.unpack_from('<H', payload, 6)[0] & 0x3fff
          h = struct.unpack_from('<H', payload, 8)[0] & 0x3fff
          if h != 90:
              raise SystemExit(f'La altura final del logo es {h}px; se requieren exactamente 90px')
          print(f'OK: logo final {w}x{h}, proporción conservada y sin deformación')
          PY
          echo "OK: ambos recursos TV contienen el mismo WebP válido, reconstruido y proporcional a 90px de alto"

      - name: Generar fuente TV 1.2.9
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_interface_1_2_9.py
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          test -s cloud-tv/public/index.html
          echo "OK: fuente TV 1.2.9 generada y origen HTML presente"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Inicializar plataforma Android del proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ]; then
            echo "La plataforma Android no está versionada; se genera con Flutter ${FLUTTER_VERSION}."
            flutter create --platforms=android --project-name=billares_don_miguel --org=com.billaresdonmiguel .
          fi
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          echo "OK: plataforma Android canónica disponible"

      - name: Configurar Android para LAN, Bluetooth, actualizaciones y segundo plano
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />')
          bt = '''    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'''
          if 'android.permission.BLUETOOTH_CONNECT' not in s:
              s = s.replace(marker, marker + '\n' + bt)
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          service = '''    <service\n                android:name="de.julianassmann.flutter_background.IsolateHolderService"\n                android:exported="false"\n                android:foregroundServiceType="specialUse" />'''
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s:
              s = s.replace('    </application>', service + '\n    </application>')
          manifest.write_text(s)
          PY

      - name: Corregir compatibilidad y preparar actualización
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          path.write_text(path.read_text().replace('AndroidNotificationImportance.low', 'AndroidNotificationImportance.normal'))
          PY

      - name: Guardar fuente TV y logo corregidos en repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anparamo25-sketch@users.noreply.github.com"
          git add lib/main.dart assets/tv-logo.webp cloud-tv/public/tv-logo.webp
          if git diff --cached --quiet; then echo "Fuente TV y logo ya sincronizados."; else git commit -m "fix: corregir logo WebP de TV y sincronizar recurso [skip ci]"; git push origin HEAD:main; fi

      - name: Formatear y verificar código
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar código sin errores ni warnings
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Verificar configuración Android
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -q 'BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml
          grep -q 'de.julianassmann.flutter_background.IsolateHolderService' android/app/src/main/AndroidManifest.xml

      - name: Verificar contrato funcional 1.2.9/129
        run: python3 scripts/validate_1_2_7_contract.py

      - name: Verificar cambios TV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('cloud-tv/public/index.html').read_text()
          required = [
              'Tiempo jugado',
              'Hora finalizada',
              'MONTO A PAGAR',
              'src="/tv-logo.webp"',
              '/api/state?ts=',
              '/api/stream',
              'setInterval(function(){if(lastState)render(lastState)},1000);',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Faltan elementos funcionales de TV: ' + ', '.join(missing))
          print('OK: interfaz TV y contador en tiempo real validados desde cloud-tv/public/index.html')
          PY
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "print_bluetooth_thermal_plus" lib/main.dart
          grep -q "esc_pos_utils_plus" lib/main.dart
          grep -q "Future<void> printReceipt(BillTable table)" lib/main.dart
          test -s assets/tv-logo.webp
          test -s cloud-tv/public/tv-logo.webp
          cmp -s assets/tv-logo.webp cloud-tv/public/tv-logo.webp
          webpinfo assets/tv-logo.webp >/dev/null

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      - name: Verificar APK generado
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-latest.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Actualizar manifiesto público de actualización
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/update.json <<EOF
          {"version":"${BUILD_NAME}+${BUILD_NUMBER}","downloadUrl":"https://github.com/anparamo25-sketch/Billares-Don-Miguel-/releases/latest/download/Billares-Don-Miguel-latest.apk"}
          EOF
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          content = Path('/tmp/update.json').read_bytes()
          encoded = base64.b64encode(content).decode()
          current = subprocess.run(['gh','api','repos/anparamo25-sketch/Billares-Don-Miguel-/contents/update.json','--method','GET','--jq','.sha'], text=True, capture_output=True, check=True)
          current_sha = current.stdout.strip()
          if not current_sha:
              raise SystemExit('No se pudo obtener el SHA actual de update.json')
          result = subprocess.run(['gh','api','repos/anparamo25-sketch/Billares-Don-Miguel-/contents/update.json','--method','PUT','--field','branch=main','--field',f'message=chore: publish update manifest {os.environ["BUILD_NAME"]}+{os.environ["BUILD_NUMBER"]}','--field',f'content={encoded}','--field',f'sha={current_sha}'], text=True, capture_output=True)
          if result.returncode != 0:
              print(result.stdout)
              print(result.stderr)
              raise SystemExit(result.returncode)
          print('Manifesto de actualización publicado correctamente.')
          PY

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release para actualizaciones
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}-build${{ github.run_number }}
          name: Billares Don Miguel v${{ env.BUILD_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
