name: Billares Don Miguel - Build APK

# Compilación de distribución 1.2.7+127 con TV en la nube.
on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.29.3
  BUILD_NAME: 1.2.7
  BUILD_NUMBER: 127
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ]; then export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"; fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/opt/android-sdk}" /usr/local/lib/android/sdk /opt/hostedtoolcache -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then echo "ERROR: No se encontró sdkmanager en el runner de GitHub."; exit 1; fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          SDK_ROOT="${ANDROID_HOME:-/opt/android-sdk}"
          rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
          installed=0
          for attempt in 1 2 3; do
            echo "Instalación Android SDK/NDK, intento $attempt/3"
            if sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"; then
              if [ -d "$SDK_ROOT/ndk/${NDK_VERSION}" ]; then installed=1; break; fi
            fi
            rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
            sleep 3
          done
          if [ "$installed" -ne 1 ]; then echo "ERROR: No se pudo instalar NDK ${NDK_VERSION} después de 3 intentos."; exit 1; fi
      - name: Generar plataforma Android limpia
        run: flutter create --platforms=android --org com.billaresdonmiguel --project-name billares_don_miguel .
      - name: Preparar versión base 1.2.6
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/main.dart
          grep -q "const String appVersion = '1.2.6+126';" lib/main.dart
          grep -q "const Map<int, double> tableRates" lib/main.dart
          grep -q "billaresdonmiguel.local" lib/main.dart
          echo "Fuente base 1.2.6+126 verificada; se aplicarán las transformaciones finales 1.2.7."
      - name: Validar scripts 1.2.7
        run: python3 -m py_compile scripts/rebuild_tv_1_2_6.py scripts/repair_1_2_6_generated.py scripts/validate_1_2_6_contract.py scripts/validate_1_2_7_contract.py scripts/enforce_1_2_6_source.py scripts/add_cloud_tv_sync_1_2_7.py
      - name: Reconstruir TV, LAN y mDNS 1.2.6
        run: python3 scripts/repair_1_2_6_generated.py
      - name: Aplicar fuente final 1.2.7
        run: python3 scripts/enforce_1_2_6_source.py
      - name: Guardar fuente final 1.2.7 en repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anparamo25-sketch@users.noreply.github.com"
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo "La fuente final 1.2.7 ya estaba sincronizada."
          else
            git commit -m "chore: sincronizar fuente final 1.2.7 [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configurar Android para LAN, actualizaciones y segundo plano
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts'); s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36').replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"').replace('minSdk = flutter.minSdkVersion', 'minSdk = 23'); gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml'); s = manifest.read_text(); marker = '<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />')
          if 'android:usesCleartextTraffic=' not in s: s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          service = '''    <service\n                android:name="de.julianassmann.flutter_background.IsolateHolderService"\n                android:exported="false"\n                android:foregroundServiceType="specialUse" />'''
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s: s = s.replace('    </application>', service + '\n    </application>')
          manifest.write_text(s)
          PY
      - name: Instalar dependencias
        run: flutter pub get
      - name: Corregir compatibilidad y preparar actualización
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart'); s = path.read_text().replace('AndroidNotificationImportance.low', 'AndroidNotificationImportance.normal'); path.write_text(s)
          PY
      - name: Formatear y verificar código
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Analizar código sin errores ni warnings
        run: flutter analyze --fatal-warnings --no-fatal-infos
      - name: Ejecutar pruebas
        run: flutter test
      - name: Verificar configuración Android
        run: |
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -q 'de.julianassmann.flutter_background.IsolateHolderService' android/app/src/main/AndroidManifest.xml
      - name: Verificar contrato funcional 1.2.7
        run: python3 scripts/validate_1_2_7_contract.py
      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}
      - name: Verificar APK generado
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-latest.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Actualizar manifiesto público de actualización
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/update.json <<EOF
          {"version":"${BUILD_NAME}+${BUILD_NUMBER}","downloadUrl":"https://github.com/anparamo25-sketch/Billares-Don-Miguel-/releases/latest/download/Billares-Don-Miguel-latest.apk"}
          EOF
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          content = Path('/tmp/update.json').read_bytes()
          encoded = base64.b64encode(content).decode()
          current = subprocess.run(['gh', 'api', 'repos/anparamo25-sketch/Billares-Don-Miguel-/contents/update.json', '--method', 'GET', '--jq', '.sha'], text=True, capture_output=True, check=True)
          current_sha = current.stdout.strip()
          if not current_sha: raise SystemExit('No se pudo obtener el SHA actual de update.json')
          result = subprocess.run(['gh', 'api', 'repos/anparamo25-sketch/Billares-Don-Miguel-/contents/update.json', '--method', 'PUT', '--field', 'branch=main', '--field', f'message=chore: publish update manifest {os.environ["BUILD_NAME"]}+{os.environ["BUILD_NUMBER"]}', '--field', f'content={encoded}', '--field', f'sha={current_sha}'], text=True, capture_output=True)
          if result.returncode == 0:
              print('Manifesto de actualización publicado correctamente con el SHA actual.')
              raise SystemExit(0)
          print(result.stdout); print(result.stderr); raise SystemExit(result.returncode)
          PY
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publicar release para actualizaciones
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}-build${{ github.run_number }}
          name: Billares Don Miguel v${{ env.BUILD_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
