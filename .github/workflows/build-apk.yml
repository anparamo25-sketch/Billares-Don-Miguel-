name: Billares Don Miguel - Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
      - .github/workflows/consolidate-source-129.yml
      - .github/workflows/direct-printer-correction.yml
      - .github/workflows/migrate-source-129.yml
      - .github/workflows/finalize-source-129.yml
      - .github/workflows/fix_cobrar_print_once.yml
      - scripts/patch_tv_interface_1_2_9.py
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.3
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          SDK_ROOT="${ANDROID_HOME}"
          rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
          installed=0
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"; then
              if [ -d "$SDK_ROOT/ndk/${NDK_VERSION}" ]; then installed=1; break; fi
            fi
            rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
            sleep 3
          done
          test "$installed" -eq 1

      - name: Inicializar plataforma Android del proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=billares_don_miguel --org=com.billaresdonmiguel .
          fi
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configurar Android de forma permanente para instalacion, LAN, Bluetooth y segundo plano
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "28.2.13676358"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          if 'namespace = "com.billaresdonmiguel.billares_don_miguel"' not in s:
              s = s.replace('android {', 'android {\n    namespace = "com.billaresdonmiguel.billares_don_miguel"', 1)
          if 'applicationId = "com.billaresdonmiguel.billares_don_miguel"' not in s:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        applicationId = "com.billaresdonmiguel.billares_don_miguel"', 1)
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />')
          bt = '''    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'''
          if 'android.permission.BLUETOOTH_CONNECT' not in s:
              s = s.replace(marker, marker + '\n' + bt)
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          service = '''    <service\n                android:name="de.julianassmann.flutter_background.IsolateHolderService"\n                android:exported="false"\n                android:foregroundServiceType="connectedDevice" />'''
          s = s.replace('android:name="de.julianassmann.flutter_background.IsolateHolderService"\n                android:exported="false"\n                android:foregroundServiceType="specialUse"', 'android:name="de.julianassmann.flutter_background.IsolateHolderService"\n                android:exported="false"\n                android:foregroundServiceType="connectedDevice"')
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s:
              s = s.replace('    </application>', service + '\n    </application>')
          s = s.replace('<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n', '')
          manifest.write_text(s)
          PY

      - name: Verificar fuente permanente
        run: |
          set -euo pipefail
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          test -s cloud-tv/public/index.html
          ! grep -R "print_bluetooth_thermal_plus" -n lib pubspec.yaml
          grep -q 'applicationId = "com.billaresdonmiguel.billares_don_miguel"' android/app/build.gradle.kts
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="connectedDevice"' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias
        run: flutter pub get

      - name: Formatear y verificar codigo
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar codigo
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Verificar contrato funcional 1.2.9/129
        run: python3 scripts/validate_1_2_7_contract.py

      - name: Verificar TV y cobro/impresion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('cloud-tv/public/index.html').read_text()
          required = ['Tiempo jugado','Hora finalizada','MONTO A PAGAR','src="/tv-logo.webp"','/api/state?ts=','/api/stream','setInterval(function(){if(lastState)render(lastState)},1000);']
          missing = [item for item in required if item not in html]
          if missing: raise SystemExit('Faltan elementos funcionales de TV: ' + ', '.join(missing))
          PY
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "esc_pos_utils_plus" lib/main.dart
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      - name: Validar APK instalable y universal
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          export PATH="${ANDROID_HOME}/build-tools/36.0.0:${ANDROID_HOME}/platform-tools:${PATH}"
          aapt dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.billaresdonmiguel.billares_don_miguel'" /tmp/apk-badging.txt
          grep -q "versionCode='129'" /tmp/apk-badging.txt
          grep -q "versionName='1.2.9'" /tmp/apk-badging.txt
          grep -q "uses-permission: name='android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE'" /tmp/apk-badging.txt
          grep -q "application-label:'Billares Don Miguel'" /tmp/apk-badging.txt
          apksigner verify --verbose "$APK"
          if zipinfo -1 "$APK" | grep -Eq '^split_config|^config\.'; then
            echo "ERROR: el APK no es universal; contiene configuraciones divididas"
            exit 1
          fi
          echo "APK_INSTALABLE_Y_UNIVERSAL=OK"

      - name: Verificar APK generado
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$APK" "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          cp "$APK" dist/Billares-Don-Miguel-latest.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}-build${{ github.run_number }}
          name: Billares Don Miguel v${{ env.BUILD_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
