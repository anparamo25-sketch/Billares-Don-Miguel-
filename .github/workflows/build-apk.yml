name: Billares Don Miguel - Release APK

"on":
  push:
    branches:
      - main
    paths-ignore:
      - lib/main.dart
      - update.json
  workflow_dispatch:

concurrency:
  group: billares-don-miguel-release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.3
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Initialize Android
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=billares_don_miguel --org=com.billaresdonmiguel .
          fi
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Apply permanent printer integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/permanent_printer_integration.py
          dart format lib/main.dart
          git diff --check
          grep -q "Future<List<BluetoothInfo>> loadThermalPrinters() async" lib/main.dart
          ! grep -A120 'Future<bool> configureThermalPrinter() async' lib/main.dart | grep -q 'PrintBluetoothThermal.bluetoothEnabled'
          grep -q 'getBondedBluetoothDevices' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml

      - name: Persist source integration safely
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart android
          git commit -m 'fix: permanently integrate thermal printer discovery'

          git fetch origin main
          git rebase origin/main

          python3 scripts/permanent_printer_integration.py
          dart format lib/main.dart
          git add lib/main.dart android
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve permanent thermal printer integration after sync'
          fi

          git push origin HEAD:main

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Verify application contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q 'applicationId = "com.billaresdonmiguel.billares_don_miguel"' android/app/build.gradle.kts
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'getBondedBluetoothDevices' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt

      - name: Dependencies
        run: flutter pub get

      - name: Format and analyze
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" | tee SHA256SUM.txt

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v1.2.9-build129
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            SHA256SUM.txt
          if-no-files-found: error
          retention-days: 30
