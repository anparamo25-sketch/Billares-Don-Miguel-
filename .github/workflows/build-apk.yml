name: Billares Don Miguel - Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
      - .github/workflows/consolidate-source-129.yml
      - .github/workflows/direct-printer-correction.yml
      - .github/workflows/migrate-source-129.yml
      - .github/workflows/finalize-source-129.yml
      - .github/workflows/fix_cobrar_print_once.yml
      - scripts/patch_tv_interface_1_2_9.py
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.3
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g\ -XX:MaxMetaspaceSize=2g\ -XX:+HeapDumpOnOutOfMemoryError\ -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Verificar plataforma Android permanente
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -q 'namespace = "com.billaresdonmiguel.billares_don_miguel"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.billaresdonmiguel.billares_don_miguel"' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.BLUETOOTH_SCAN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="connectedDevice"' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
          grep -q 'getBondedBluetoothDevices' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt
          grep -q 'acquireMulticastLock' android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt

      - name: Verificar integracion permanente de impresora termica
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "PrintBluetoothThermal.pairedBluetooths" lib/main.dart
          ! grep -A80 'Future<bool> configureThermalPrinter() async {' lib/main.dart | grep -q 'PrintBluetoothThermal.bluetoothEnabled'
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart
          grep -q "'billaresdonmiguel/network'" lib/main.dart
          grep -q "acquireMulticastLock" lib/main.dart

      - name: Verificar fuente funcional 1.2.9/129
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          test -s cloud-tv/public/index.html
          ! grep -R "print_bluetooth_thermal_plus" -n lib pubspec.yaml
          git diff --check

      - name: Instalar dependencias
        run: flutter pub get

      - name: Formatear y verificar codigo
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar codigo
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Verificar contrato funcional 1.2.9/129
        run: python3 scripts/validate_1_2_7_contract.py

      - name: Verificar TV y cobro/impresion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('cloud-tv/public/index.html').read_text()
          required = [
              'Tiempo jugado',
              'Hora finalizada',
              'MONTO A PAGAR',
              'src="/tv-logo.webp"',
              '/api/state?ts=',
              '/api/stream',
              'setInterval(function(){if(lastState)render(lastState)},1000);',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Faltan elementos funcionales de TV: ' + ', '.join(missing))
          PY
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "esc_pos_utils_plus" lib/main.dart
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart
          grep -q "'billaresdonmiguel/network'" lib/main.dart

      - name: Preparar Gradle Wrapper determinista
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            TMP_PROJECT="$(mktemp -d)"
            flutter create --platforms=android --project-name=gradle_bootstrap --org=com.billaresdonmiguel "$TMP_PROJECT"
            cp "$TMP_PROJECT/android/gradlew" android/gradlew
            cp "$TMP_PROJECT/android/gradlew.bat" android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp "$TMP_PROJECT/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            cp "$TMP_PROJECT/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
            rm -rf "$TMP_PROJECT"
          fi
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradle/wrapper/gradle-wrapper.properties
          cd android
          ./gradlew --version

      - name: Limpiar intermediarios antes de compilar
        run: flutter clean

      - name: Compilar APK release
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      - name: Validar APK instalable y universal
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          export PATH="${ANDROID_HOME}/build-tools/36.0.0:${ANDROID_HOME}/platform-tools:${PATH}"
          aapt dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.billaresdonmiguel.billares_don_miguel'" /tmp/apk-badging.txt
          grep -q "versionCode='129'" /tmp/apk-badging.txt
          grep -q "versionName='1.2.9'" /tmp/apk-badging.txt
          grep -q "uses-permission: name='android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE'" /tmp/apk-badging.txt
          grep -q "application-label:'Billares Don Miguel'" /tmp/apk-badging.txt
          apksigner verify --verbose "$APK"
          if zipinfo -1 "$APK" | grep -Eq '^split_config|^config\.'; then
            echo "ERROR: el APK no es universal; contiene configuraciones divididas"
            exit 1
          fi
          echo "APK_INSTALABLE_Y_UNIVERSAL=OK"

      - name: Verificar APK generado
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$APK" "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          cp "$APK" dist/Billares-Don-Miguel-latest.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}-build${{ github.run_number }}
          name: Billares Don Miguel v${{ env.BUILD_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            dist/Billares-Don-Miguel-latest.apk
            dist/Billares-Don-Miguel-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}.apk
            dist/SHA256SUMS.txt
