name: Billares Don Miguel - Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.29.3
  BUILD_NAME: 1.2.4
  BUILD_NUMBER: 124
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/opt/android-sdk}" /usr/local/lib/android/sdk /opt/hostedtoolcache -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: No se encontró sdkmanager en el runner de GitHub."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager: $(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - name: Generar plataforma Android limpia
        run: |
          flutter create --platforms=android --org com.billaresdonmiguel --project-name billares_don_miguel .
          git checkout -- lib/main.dart test/widget_test.dart
          echo "Código Dart original restaurado después de flutter create."

      - name: Configurar Android para LAN, actualizaciones, segundo plano y compatibilidad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />'
              )
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          service = '''    <service
                android:name="de.julianassmann.flutter_background.IsolateHolderService"
                android:exported="false"
                android:foregroundServiceType="specialUse" />'''
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s:
              s = s.replace('    </application>', service + '\n    </application>')
          manifest.write_text(s)
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Corregir compatibilidad del plugin, actualización y LAN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('lib/main.dart')
          s = path.read_text()
          version = '1.2.4+124'
          s = s.replace('AndroidNotificationImportance.low', 'AndroidNotificationImportance.normal')
          s, version_count = re.subn(r"const String appVersion = '[^']+';", f"const String appVersion = '{version}';", s, count=1)
          s, url_count = re.subn(r"const String updateManifestUrl = '[^']+';", "const String updateManifestUrl = 'https://raw.githubusercontent.com/anparamo25-sketch/Billares-Don-Miguel-/main/update.json';", s, count=1)
          if version_count != 1 or url_count != 1:
              raise SystemExit(f'ERROR: no se pudo preparar main.dart (version_count={version_count}, url_count={url_count})')

          old_client = "client = HttpClient()..connectionTimeout = const Duration(seconds: 8);"
          new_client = "client = HttpClient()..connectionTimeout = const Duration(seconds: 12);\n      client.userAgent = 'Billares-Don-Miguel/1.2.4';"
          if old_client in s:
              s = s.replace(old_client, new_client, 1)
          elif "client.userAgent = 'Billares-Don-Miguel/1.2.4';" not in s:
              raise SystemExit('ERROR: no se encontró la configuración HttpClient esperada')

          old_lan = '''  Future<void> startLanServer() async {
    try {
      server = await HttpServer.bind(InternetAddress.anyIPv4, 8080, shared: true);
      final List<NetworkInterface> interfaces = await NetworkInterface.list(type: InternetAddressType.IPv4, includeLoopback: false);
      for (final NetworkInterface networkInterface in interfaces) {
        for (final InternetAddress address in networkInterface.addresses) {
          if (!address.isLoopback) {
            lanIp = address.address;
            break;
          }
        }
        if (lanIp != null) break;
      }
      server!.listen(handleRequest);
      if (mounted) setState(() {});
    } catch (_) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('No se pudo iniciar el servidor LAN en el puerto 8080')));
      }
    }
  }'''
          new_lan = '''  bool isPrivateLanAddress(InternetAddress address) {
    if (address.type != InternetAddressType.IPv4 || address.isLoopback) return false;
    final List<int> octets = address.address.split('.').map(int.parse).toList();
    if (octets.length != 4) return false;
    return octets[0] == 10 ||
        (octets[0] == 172 && octets[1] >= 16 && octets[1] <= 31) ||
        (octets[0] == 192 && octets[1] == 168);
  }

  Future<void> startLanServer() async {
    try {
      server = await HttpServer.bind(InternetAddress.anyIPv4, 8080, shared: true);
      final List<NetworkInterface> interfaces = await NetworkInterface.list(type: InternetAddressType.IPv4, includeLoopback: false);

      InternetAddress? selectedAddress;
      for (final NetworkInterface networkInterface in interfaces) {
        final String name = networkInterface.name.toLowerCase();
        final bool looksLikeWifi = name.contains('wlan') || name.contains('wifi') || name.contains('wi-fi');
        if (!looksLikeWifi) continue;
        for (final InternetAddress address in networkInterface.addresses) {
          if (isPrivateLanAddress(address)) {
            selectedAddress = address;
            break;
          }
        }
        if (selectedAddress != null) break;
      }

      if (selectedAddress == null) {
        for (final NetworkInterface networkInterface in interfaces) {
          for (final InternetAddress address in networkInterface.addresses) {
            if (isPrivateLanAddress(address)) {
              selectedAddress = address;
              break;
            }
          }
          if (selectedAddress != null) break;
        }
      }

      lanIp = selectedAddress?.address;
      server!.listen(handleRequest);
      if (mounted) setState(() {});
    } catch (_) {
      server = null;
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('No se pudo iniciar el servidor LAN en el puerto 8080')));
      }
    }
  }'''
          if old_lan not in s:
              raise SystemExit('ERROR: no se encontró el bloque LAN original; se detiene para proteger las funciones existentes')
          s = s.replace(old_lan, new_lan, 1)

          old_tv = "final String url = 'http://$lanIp:8080/tv';"
          new_tv = "final String url = 'http://$lanIp:8080/tv';"
          if old_tv not in s:
              raise SystemExit('ERROR: no se encontró la dirección de TV esperada')

          path.write_text(s)
          PY
          dart fix --apply

      - name: Formatear y verificar código
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar código sin tolerar errores ni warnings
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Verificar configuración Android
        run: |
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -q 'de.julianassmann.flutter_background.IsolateHolderService' android/app/src/main/AndroidManifest.xml
          echo "Configuración Android verificada: compileSdk 36, NDK 27, minSdk 23 y servicio de segundo plano"

      - name: Verificar actualización y LAN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          required = [
              "const String appVersion = '1.2.4+124';",
              'https://raw.githubusercontent.com/anparamo25-sketch/Billares-Don-Miguel-/main/update.json',
              "client.userAgent = 'Billares-Don-Miguel/1.2.4';",
              'HttpServer.bind(InternetAddress.anyIPv4, 8080, shared: true)',
              'bool isPrivateLanAddress(InternetAddress address)',
              "name.contains('wlan') || name.contains('wifi') || name.contains('wi-fi')",
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('ERROR: configuración de actualización/LAN incompleta: ' + repr(missing))
          print('Configuración de actualización y LAN verificada correctamente para 1.2.4+124')
          PY

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=1.2.4 --build-number=124

      - name: Verificar APK generado
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-v1.2.4-build124-run${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-latest.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Actualizar manifiesto público de actualización sin conflictos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/update.json <<EOF
          {
            "version": "1.2.4+124",
            "downloadUrl": "https://github.com/anparamo25-sketch/Billares-Don-Miguel-/releases/latest/download/Billares-Don-Miguel-latest.apk"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publicación de update.json: intento ${attempt}/5"
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/update.json update.json
            git add update.json

            if git diff --cached --quiet; then
              echo "update.json ya contiene la versión 1.2.4+124."
              break
            fi

            git commit -m "chore: publish update manifest 1.2.4+124"

            if git push origin HEAD:main; then
              echo "update.json publicado correctamente."
              break
            fi

            echo "Push rechazado por cambios concurrentes; se vuelve a sincronizar."
            git reset --hard origin/main
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: no fue posible publicar update.json después de 5 intentos."
              exit 1
            fi
            sleep 2
          done

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v1.2.4-build124-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release para actualizaciones
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4-build${{ github.run_number }}
          name: Billares Don Miguel v1.2.4 (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
