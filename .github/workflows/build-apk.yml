name: Billares Don Miguel - Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.29.3
  BUILD_NAME: 1.2.2
  BUILD_NUMBER: 122
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/opt/android-sdk}" /usr/local/lib/android/sdk /opt/hostedtoolcache -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: No se encontró sdkmanager en el runner de GitHub."
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          echo "sdkmanager: $(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - name: Generar plataforma Android limpia
        run: flutter create --platforms=android --org com.billaresdonmiguel --project-name billares_don_miguel .

      - name: Configurar Android para LAN, actualizaciones, segundo plano y compatibilidad
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />'
              )
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          service = '''    <service
                android:name="de.julianassmann.flutter_background.IsolateHolderService"
                android:exported="false"
                android:foregroundServiceType="specialUse" />'''
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s:
              s = s.replace('    </application>', service + '\n    </application>')
          manifest.write_text(s)
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Corregir compatibilidad del plugin y comprobador de actualizaciones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/main.dart')
          s = path.read_text()
          s = s.replace('AndroidNotificationImportance.low', 'AndroidNotificationImportance.normal')
          s = s.replace("const String appVersion = '1.2.1+121';", "const String appVersion = '1.2.2+122';")
          if 'updateManifestGitHubRawUrl' not in s:
              s = s.replace(
                  "const String updateManifestUrl = 'https://raw.githubusercontent.com/anparamo25-sketch/Billares-Don-Miguel-/main/update.json';",
                  "const String updateManifestUrl = 'https://raw.githubusercontent.com/anparamo25-sketch/Billares-Don-Miguel-/main/update.json';\nconst String updateManifestGitHubRawUrl = 'https://github.com/anparamo25-sketch/Billares-Don-Miguel-/raw/refs/heads/main/update.json';\nconst String updateManifestApiUrl = 'https://api.github.com/repos/anparamo25-sketch/Billares-Don-Miguel-/contents/update.json?ref=main';"
              )

          start = s.index('  Future<void> checkForUpdate({bool showNoUpdate = true}) async {')
          end = s.index('  Future<void> changePassword() async {', start)
          replacement = r'''  Future<Map<String, dynamic>> fetchUpdateManifest(HttpClient client) async {
    final List<String> urls = <String>[
      updateManifestUrl,
      updateManifestGitHubRawUrl,
      updateManifestApiUrl,
    ];
    Object? lastError;

    for (final String url in urls) {
      try {
        final String separator = url.contains('?') ? '&' : '?';
        final HttpClientRequest request = await client.getUrl(Uri.parse('$url${separator}x=${DateTime.now().millisecondsSinceEpoch}'));
        request.followRedirects = true;
        request.maxRedirects = 5;
        request.headers.set(HttpHeaders.cacheControlHeader, 'no-cache');
        request.headers.set(HttpHeaders.acceptHeader, 'application/json');
        request.headers.set(HttpHeaders.userAgentHeader, 'Billares-Don-Miguel/$appVersion');

        final HttpClientResponse response = await request.close();
        final String body = await response.transform(utf8.decoder).join();
        if (response.statusCode != 200) {
          throw HttpException('HTTP ${response.statusCode}', uri: Uri.parse(url));
        }

        final Map<String, dynamic> data = jsonDecode(body) as Map<String, dynamic>;
        if (url == updateManifestApiUrl) {
          final String? encoded = data['content'] as String?;
          if (encoded == null || encoded.isEmpty) throw const FormatException('Contenido del manifiesto vacío');
          final String decoded = utf8.decode(base64.decode(encoded.replaceAll(RegExp(r'\s'), '')));
          return jsonDecode(decoded) as Map<String, dynamic>;
        }
        return data;
      } catch (error) {
        lastError = error;
      }
    }

    throw HttpException('No se pudo obtener update.json: $lastError');
  }

  Future<void> checkForUpdate({bool showNoUpdate = true}) async {
    if (checkingUpdate || !mounted) return;
    setState(() => checkingUpdate = true);
    final HttpClient client = HttpClient()..connectionTimeout = const Duration(seconds: 10);
    try {
      final Map<String, dynamic> manifest = await fetchUpdateManifest(client);
      final String latestVersion = (manifest['version'] as String?)?.trim() ?? '';
      final String? downloadUrl = (manifest['downloadUrl'] ?? manifest['apk_url']) as String?;

      if (latestVersion.isEmpty || downloadUrl == null || downloadUrl.trim().isEmpty) {
        throw const FormatException('update.json incompleto');
      }

      if (buildNumber(latestVersion) <= buildNumber(appVersion)) {
        if (showNoUpdate && mounted) {
          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('La aplicación ya está actualizada')));
        }
        return;
      }

      if (!mounted) return;
      final bool? install = await showDialog<bool>(
        context: context,
        builder: (BuildContext context) => AlertDialog(
          title: const Text('Nueva actualización disponible'),
          content: Text('Hay una nueva versión ($latestVersion). ¿Deseas actualizar ahora?'),
          actions: <Widget>[
            TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Más tarde')),
            FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Actualizar ahora')),
          ],
        ),
      );
      if (install == true) await downloadAndInstall(downloadUrl.trim());
    } catch (_) {
      if (showNoUpdate && mounted) {
        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('No se pudo comprobar la actualización. La aplicación continúa funcionando normalmente.')));
      }
    } finally {
      client.close(force: true);
      if (mounted) setState(() => checkingUpdate = false);
    }
  }

  Future<void> downloadAndInstall(String url) async {
    HttpClient? client;
    try {
      if (!mounted) return;
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Descargando actualización...')));
      final Directory directory = await getApplicationDocumentsDirectory();
      final String path = '${directory.path}/billares-don-miguel-update.apk';
      client = HttpClient()..connectionTimeout = const Duration(seconds: 30);
      final HttpClientRequest request = await client.getUrl(Uri.parse(url));
      request.followRedirects = true;
      request.maxRedirects = 10;
      request.headers.set(HttpHeaders.userAgentHeader, 'Billares-Don-Miguel/$appVersion');
      final HttpClientResponse response = await request.close();
      if (response.statusCode != 200) throw HttpException('Descarga HTTP ${response.statusCode}');
      final File file = File(path);
      final IOSink sink = file.openWrite();
      await response.pipe(sink);
      await sink.flush();
      await sink.close();
      if (!await file.exists() || await file.length() < 1000000) throw const HttpException('APK descargado incompleto');
      await ApkInstall().onInstallApk(path);
    } catch (_) {
      if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('No se pudo descargar o iniciar la instalación de la actualización.')));
    } finally {
      client?.close(force: true);
    }
  }

'''
          s = s[:start] + replacement + s[end:]
          path.write_text(s)
          PY
          dart fix --apply

      - name: Formatear y verificar código
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar código sin tolerar errores ni warnings
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Verificar configuración Android
        run: |
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -q 'de.julianassmann.flutter_background.IsolateHolderService' android/app/src/main/AndroidManifest.xml
          echo "Configuración Android verificada: compileSdk 36, NDK 27, minSdk 23 y servicio de segundo plano"

      - name: Verificar comprobador de actualizaciones
        run: |
          grep -q "appVersion = '1.2.2+122'" lib/main.dart
          grep -q 'updateManifestGitHubRawUrl' lib/main.dart
          grep -q 'updateManifestApiUrl' lib/main.dart
          grep -q 'fetchUpdateManifest' lib/main.dart
          grep -q 'followRedirects = true' lib/main.dart
          echo "Comprobador de actualizaciones verificado: 3 fuentes, redirecciones y API de respaldo"

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      - name: Verificar APK generado
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-latest.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Actualizar manifiesto público de actualización sin conflictos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/update.json <<EOF
          {
            "version": "${BUILD_NAME}+${BUILD_NUMBER}",
            "downloadUrl": "https://github.com/anparamo25-sketch/Billares-Don-Miguel-/releases/latest/download/Billares-Don-Miguel-latest.apk"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publicación de update.json: intento ${attempt}/5"
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/update.json update.json
            git add update.json

            if git diff --cached --quiet; then
              echo "update.json ya contiene la versión ${BUILD_NAME}+${BUILD_NUMBER}."
              break
            fi

            git commit -m "chore: publish update manifest ${BUILD_NAME}+${BUILD_NUMBER}"

            if git push origin HEAD:main; then
              echo "update.json publicado correctamente."
              break
            fi

            echo "Push rechazado por cambios concurrentes; se vuelve a sincronizar."
            git reset --hard origin/main
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: no fue posible publicar update.json después de 5 intentos."
              exit 1
            fi
            sleep 2
          done

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release para actualizaciones
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}-build${{ github.run_number }}
          name: Billares Don Miguel v${{ env.BUILD_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
