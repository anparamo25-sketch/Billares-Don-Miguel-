name: Billares Don Miguel - Build APK
on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
  workflow_dispatch:
permissions:
  contents: write
env:
  FLUTTER_VERSION: 3.47.3
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Preparar Android
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=billares_don_miguel --org=com.billaresdonmiguel .
          fi
          python3 - <<'PY'
          from pathlib import Path
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          s = s.replace('namespace = "com.example.billares_don_miguel"', 'namespace = "com.billaresdonmiguel.billares_don_miguel"')
          s = s.replace('applicationId = "com.example.billares_don_miguel"', 'applicationId = "com.billaresdonmiguel.billares_don_miguel"')
          g.write_text(s)
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          perms = '''    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
    <uses-permission android:name="android.permission.BLUETOOTH" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'''
          if 'android.permission.BLUETOOTH_CONNECT' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + perms)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s:
              s = s.replace('    </application>', '    <service android:name="de.julianassmann.flutter_background.IsolateHolderService" android:exported="false" android:foregroundServiceType="connectedDevice" />\n    </application>')
          m.write_text(s)
          PY
      - name: Corregir impresora termica en fuente de compilacion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """      if (!await PrintBluetoothThermal.bluetoothEnabled) {
        if (mounted) {
          await showDialog<void>(
            context: context,
            builder:
                (BuildContext dialogContext) => AlertDialog(
                  title: const Text('Bluetooth desactivado'),
                  content: const Text(
                    'Activa Bluetooth en la tablet y vuelve a pulsar Configurar impresora térmica.',
                  ),
                  actions: <Widget>[
                    FilledButton(
                      onPressed: () => Navigator.pop(dialogContext),
                      child: const Text('Cerrar'),
                    ),
                  ],
                ),
          );
        }
        return false;
      }
      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
"""
          new = """      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
"""
          if old not in s:
              raise SystemExit('ERROR: no se encontro el bloqueo Bluetooth incorrecto.')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          a = s.index('Future<bool> configureThermalPrinter() async {')
          b = s.index('Future<String?> printReceipt', a)
          block = s[a:b]
          assert 'PrintBluetoothThermal.bluetoothEnabled' not in block
          assert 'PrintBluetoothThermal.pairedBluetooths' in block
          print('THERMAL_PRINTER_SOURCE_FIX=OK')
          PY
      - name: Dependencias y pruebas
        run: |
          flutter pub get
          flutter test
      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}
      - name: Validar y publicar APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          export PATH="${ANDROID_HOME}/build-tools/36.0.0:${ANDROID_HOME}/platform-tools:${PATH}"
          aapt dump badging "$APK" | tee /tmp/apk.txt
          grep -q "package: name='com.billaresdonmiguel.billares_don_miguel'" /tmp/apk.txt
          grep -q "versionCode='129'" /tmp/apk.txt
          grep -q "versionName='1.2.9'" /tmp/apk.txt
          apksigner verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
