name: Billares Don Miguel - Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - update.json
      - .github/workflows/build-apk.yml
      - .github/workflows/consolidate-source-129.yml
      - .github/workflows/direct-printer-correction.yml
      - .github/workflows/migrate-source-129.yml
      - .github/workflows/finalize-source-129.yml
      - .github/workflows/fix-cobrar-print-once.yml
      - scripts/patch_tv_interface_1_2_9.py
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.3
  BUILD_NAME: 1.2.9
  BUILD_NUMBER: 129
  MIN_SDK: 23
  COMPILE_SDK: 36
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Integrar fuente permanentemente antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart; then
            echo "INTEGRACION_FUENTE_YA_EXISTE=OK"
            exit 0
          fi
          python3 .github/scripts/integrate_printer.py
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "thermal_printer_mac" lib/main.dart
          grep -q "thermal_printer_name" lib/main.dart
          grep -q "Impresora térmica" lib/main.dart
          grep -q "La impresora guardada ya no está emparejada" lib/main.dart
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          echo "INTEGRACION_FUENTE_VERIFICADA=OK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/integrate-thermal-printer.yml .github/workflows/thermal-printer-integrate-once.yml .github/scripts/integrate_printer.py .github/integration.trigger || true
          git add -A
          git commit -m "Integra configuración permanente de impresora térmica"
          git push origin HEAD:main
          echo "INTEGRACION_FUENTE_GUARDADA_EN_MAIN=OK"
          echo "La integración ya quedó permanente. Esta ejecución termina aquí para que la siguiente compilación parta del nuevo commit."
          exit 0

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Preparar SDK y NDK de Android
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          SDK_ROOT="${ANDROID_HOME}"
          rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
          installed=0
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"; then
              if [ -d "$SDK_ROOT/ndk/${NDK_VERSION}" ]; then installed=1; break; fi
            fi
            rm -rf "$SDK_ROOT/ndk/${NDK_VERSION}" "$SDK_ROOT/.temp" || true
            sleep 3
          done
          test "$installed" -eq 1

      - name: Verificar fuente permanente
        run: |
          set -euo pipefail
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          test -s cloud-tv/public/index.html
          ! grep -R "print_bluetooth_thermal_plus" -n lib pubspec.yaml

      - name: Instalar dependencias
        run: flutter pub get

      - name: Inicializar plataforma Android del proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=billares_don_miguel --org=com.billaresdonmiguel .
          fi
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configurar Android para LAN Bluetooth actualizaciones y segundo plano
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('ndkVersion = flutter.ndkVersion', 'ndkVersion = "27.0.12077973"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />')
          bt = '''    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'''
          if 'android.permission.BLUETOOTH_CONNECT' not in s:
              s = s.replace(marker, marker + '\n' + bt)
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="billares_don_miguel"', 'android:label="Billares Don Miguel"')
          service = '''    <service\n                android:name="de.julianassmann.flutter_background.IsolateHolderService"\n                android:exported="false"\n                android:foregroundServiceType="specialUse" />'''
          if 'de.julianassmann.flutter_background.IsolateHolderService' not in s:
              s = s.replace('    </application>', service + '\n    </application>')
          manifest.write_text(s)
          PY

      - name: Formatear y verificar codigo
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Analizar codigo
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Verificar contrato funcional 1.2.9/129
        run: python3 scripts/validate_1_2_7_contract.py

      - name: Verificar TV y cobro/impresion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('cloud-tv/public/index.html').read_text()
          required = ['Tiempo jugado','Hora finalizada','MONTO A PAGAR','src="/tv-logo.webp"','/api/state?ts=','/api/stream','setInterval(function(){if(lastState)render(lastState)},1000);']
          missing = [item for item in required if item not in html]
          if missing: raise SystemExit('Faltan elementos funcionales de TV: ' + ', '.join(missing))
          PY
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "esc_pos_utils_plus" lib/main.dart
          grep -q "Future<String?> printReceipt(BillTable table)" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --build-name=${BUILD_NAME} --build-number=${BUILD_NUMBER}

      - name: Verificar APK generado
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Billares-Don-Miguel-v${BUILD_NAME}-build${BUILD_NUMBER}-run${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk dist/Billares-Don-Miguel-latest.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v${{ env.BUILD_NAME }}-build${{ env.BUILD_NUMBER }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}-build${{ github.run_number }}
          name: Billares Don Miguel v${{ env.BUILD_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/Billares-Don-Miguel-latest.apk
