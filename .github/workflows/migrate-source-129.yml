name: Migrar fuente 1.2.9 a código permanente

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.29.3

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout código actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar una única vez la fuente permanente desde los archivos del proyecto
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_interface_1_2_9.py

      - name: Convertir dependencias y dejar la fuente autónoma
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          pub = pubspec.read_text(encoding='utf-8')
          pub = pub.replace('print_bluetooth_thermal_plus: ^1.0.0', 'print_bluetooth_thermal: ^1.2.4')
          pubspec.write_text(pub, encoding='utf-8')

          main = Path('lib/main.dart')
          source = main.read_text(encoding='utf-8')
          source = source.replace(
              "package:print_bluetooth_thermal_plus/print_bluetooth_thermal.dart",
              "package:print_bluetooth_thermal/print_bluetooth_thermal.dart",
          )

          metrics = '''                metricCard(
                  'Disponibles',
                  '$available',
                  Icons.check_circle_outline,
                ),
                metricCard('En juego', '$playing', Icons.sports_bar),
                metricCard('Pendientes', '$pending', Icons.payments_outlined),
                metricCard(
                  'Generado hoy',
                  money(todayTotal),
                  Icons.attach_money,
                ),'''
          if metrics not in source:
              raise SystemExit('No se encontró exactamente el bloque de métricas esperado.')
          source = source.replace(
              metrics,
              '''                metricCard(
                  'Generado hoy',
                  money(todayTotal),
                  Icons.attach_money,
                ),''',
              1,
          )
          main.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/build-apk.yml')
          w = workflow.read_text(encoding='utf-8')
          old_step = '''      - name: Generar fuente TV 1.2.9
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_interface_1_2_9.py
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          test -s cloud-tv/public/index.html
          echo "OK: fuente TV 1.2.9 generada y origen HTML presente"

'''
          if old_step not in w:
              raise SystemExit('No se encontró el paso de generación temporal en build-apk.yml.')
          w = w.replace(old_step, '')
          w = w.replace('grep -q "print_bluetooth_thermal_plus" lib/main.dart', 'grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart')
          w = w.replace("          grep -q \"String get tvHtml =>\" lib/main.dart\n", "          grep -q \"String get tvHtml =>\" lib/main.dart\n          grep -q \"Future<bool> configureThermalPrinter() async\" lib/main.dart\n          test ! -e scripts/patch_tv_interface_1_2_9.py\n")
          workflow.write_text(w, encoding='utf-8')
          PY

      - name: Verificar migración antes de publicar
        run: |
          set -euo pipefail
          grep -q "print_bluetooth_thermal: ^1.2.4" pubspec.yaml
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "ReceiptPreviewPage" lib/main.dart
          grep -q "Generado hoy" lib/main.dart
          ! grep -q "Disponibles" lib/main.dart
          ! grep -q "metricCard('En juego'" lib/main.dart
          ! grep -q "metricCard('Pendientes'" lib/main.dart
          ! test -e scripts/patch_tv_interface_1_2_9.py
          ! grep -q "patch_tv_interface_1_2_9.py" .github/workflows/build-apk.yml
          dart format lib test
          flutter pub get
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test

      - name: Publicar fuente corregida y retirar migrador
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_tv_interface_1_2_9.py .github/workflows/migrate-source-129.yml
          git add pubspec.yaml lib/main.dart .github/workflows/build-apk.yml
          git commit -m "Corrige fuente permanente TV y configuración de impresora"
          git push origin HEAD:main
