name: Fix Cobrar once

on:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - '.github/workflows/fix-cobrar-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reparar Cobrar sin depender de impresora
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """  Future<void> collect(BillTable table) async {\n    if (table.start != null && table.end != null && table.amount > 0) {\n      await printReceipt(table);\n    }\n    if (table.status != TableStatus.pending || table.start == null || table.end == null) return;"""
          new = """  Future<void> collect(BillTable table) async {\n    // Cobrar debe funcionar aunque no haya impresora Bluetooth disponible.\n    // La impresión queda como acción independiente en 'Imprimir recibo'.\n    if (table.status != TableStatus.pending || table.start == null || table.end == null) return;"""
          if old not in s:
              raise SystemExit('No se encontró el bloque actual de Cobrar; no se modifica el archivo.')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anparamo25-sketch@users.noreply.github.com"
          git add lib/main.dart
          git rm .github/workflows/fix-cobrar-once.yml
          git commit -m "fix: hacer Cobrar independiente de impresora [skip ci]"
          git push origin HEAD:main
