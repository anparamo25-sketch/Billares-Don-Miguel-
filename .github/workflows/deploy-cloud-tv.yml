name: Deploy Cloud TV to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'cloud-tv/**'
      - '.github/workflows/deploy-cloud-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloud TV to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud-tv
          command: pages deploy ./public --project-name=billaresdonmiguel
