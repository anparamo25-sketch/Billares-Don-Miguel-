name: Billares Don Miguel - Thermal Printer Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-thermal-printer-fix.yml'
      - 'lib/main.dart'
      - 'pubspec.yaml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - name: Corregir fuente permanentemente
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text()
          helper='''  Future<List<BluetoothInfo>> loadThermalPrinters() async {
            try {
              final List<BluetoothInfo> printers = await PrintBluetoothThermal.pairedBluetooths;
              if (printers.isNotEmpty) return printers;
            } catch (_) {}
            try {
              final List<dynamic> native = await const MethodChannel('billaresdonmiguel/network').invokeMethod<List<dynamic>>('getBondedBluetoothDevices') ?? <dynamic>[];
              return native.map((dynamic item) {
                final Map<dynamic, dynamic> data = Map<dynamic, dynamic>.from(item as Map);
                return BluetoothInfo(name: (data['name'] as String?) ?? '', macAdress: (data['macAdress'] as String?) ?? '');
              }).where((BluetoothInfo item) => item.macAdress.isNotEmpty).toList();
            } catch (_) { return <BluetoothInfo>[]; }
          }

'''
          marker='  Future<bool> configureThermalPrinter() async {'
          if 'Future<List<BluetoothInfo>> loadThermalPrinters() async {' not in s:
              if marker not in s: raise SystemExit('ERROR: no se encontro configureThermalPrinter().')
              s=s.replace(marker,helper+marker,1)
          s=s.replace('final List<BluetoothInfo> printers =\n          await PrintBluetoothThermal.pairedBluetooths;','final List<BluetoothInfo> printers = await loadThermalPrinters();')
          start=s.find('Future<bool> configureThermalPrinter() async {'); end=s.find('Future<String?> printReceipt',start)
          if start<0 or end<0: raise SystemExit('ERROR: no se pudo localizar el bloque de impresora.')
          block=s[start:end]
          if 'PrintBluetoothThermal.bluetoothEnabled' in block: raise SystemExit('ERROR: sigue el bloqueo bluetoothEnabled.')
          if 'loadThermalPrinters()' not in block: raise SystemExit('ERROR: falta loadThermalPrinters().')
          p.write_text(s)
          PY
          dart format lib/main.dart
          git diff --check
          if ! git diff --quiet -- lib/main.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/main.dart
            git commit -m 'fix: robust paired thermal printer discovery'
            git push
          fi
      - name: Inicializar Android y permisos permanentes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ]; then flutter create --platforms=android --project-name=billares_don_miguel --org=com.billaresdonmiguel .; fi
          python3 - <<'PY'
          from pathlib import Path
          g=Path('android/app/build.gradle.kts'); s=g.read_text(); s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36').replace('ndkVersion = flutter.ndkVersion','ndkVersion = "27.0.12077973"').replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          if 'namespace = "com.billaresdonmiguel.billares_don_miguel"' not in s: s=s.replace('android {','android {\n    namespace = "com.billaresdonmiguel.billares_don_miguel"',1)
          if 'applicationId = "com.billaresdonmiguel.billares_don_miguel"' not in s: s=s.replace('defaultConfig {','defaultConfig {\n        applicationId = "com.billaresdonmiguel.billares_don_miguel"',1)
          g.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml'); s=m.read_text(); marker='<uses-permission android:name="android.permission.INTERNET" />'
          if marker not in s: s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />')
          bt='''    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'''
          if 'android.permission.BLUETOOTH_CONNECT' not in s: s=s.replace(marker,marker+'\n'+bt)
          if 'android:usesCleartextTraffic=' not in s: s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          s=s.replace('android:foregroundServiceType="specialUse"','android:foregroundServiceType="connectedDevice"'); m.write_text(s)
          PY
          mkdir -p android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel
          cat > android/app/src/main/kotlin/com/billaresdonmiguel/billares_don_miguel/MainActivity.kt <<'KOTLIN'
          package com.billaresdonmiguel.billares_don_miguel
          import android.Manifest
          import android.bluetooth.BluetoothManager
          import android.content.pm.PackageManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity : FlutterActivity() {
            private val channelName="billaresdonmiguel/network"; private val bluetoothPermissionRequestCode=4901; private var pendingBluetoothResult:MethodChannel.Result?=null; private var multicastLock:WifiManager.MulticastLock?=null
            override fun configureFlutterEngine(@NonNull flutterEngine:FlutterEngine){super.configureFlutterEngine(flutterEngine);MethodChannel(flutterEngine.dartExecutor.binaryMessenger,channelName).setMethodCallHandler{call,result->when(call.method){"acquireMulticastLock"->{try{val wifi=applicationContext.getSystemService(WIFI_SERVICE) as WifiManager;if(multicastLock==null){multicastLock=wifi.createMulticastLock("BillaresDonMiguel");multicastLock?.setReferenceCounted(false)};if(multicastLock?.isHeld!=true)multicastLock?.acquire()}catch(_:Exception){};result.success(null)};"getBondedBluetoothDevices"->getBondedBluetoothDevices(result);else->result.notImplemented()}}}
            private fun getBondedBluetoothDevices(result:MethodChannel.Result){try{if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.S&&checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)!=PackageManager.PERMISSION_GRANTED){pendingBluetoothResult=result;requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT),bluetoothPermissionRequestCode);return};result.success(readBondedBluetoothDevices())}catch(e:SecurityException){result.error("BLUETOOTH_PERMISSION",e.message,null)}catch(e:Exception){result.error("BLUETOOTH_READ",e.message,null)}}
            private fun readBondedBluetoothDevices():List<Map<String,String>>{val adapter=getSystemService(BluetoothManager::class.java)?.adapter?:return emptyList();if(!adapter.isEnabled)return emptyList();return adapter.bondedDevices.mapNotNull{d->try{mapOf("name" to(d.name?:""),"macAdress" to d.address)}catch(_:SecurityException){null}}}
            override fun onRequestPermissionsResult(requestCode:Int,permissions:Array<out String>,grantResults:IntArray){super.onRequestPermissionsResult(requestCode,permissions,grantResults);if(requestCode!=bluetoothPermissionRequestCode)return;val r=pendingBluetoothResult?:return;pendingBluetoothResult=null;if(grantResults.isNotEmpty()&&grantResults[0]==PackageManager.PERMISSION_GRANTED)r.success(readBondedBluetoothDevices())else r.error("BLUETOOTH_PERMISSION","Permiso Bluetooth no concedido.",null)}
            override fun onDestroy(){try{multicastLock?.let{if(it.isHeld)it.release()}}catch(_:Exception){};multicastLock=null;super.onDestroy()}
          }
          KOTLIN
      - name: Preparar SDK NDK dependencias y validar
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          flutter pub get
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "Future<List<BluetoothInfo>> loadThermalPrinters() async" lib/main.dart
          grep -q "getBondedBluetoothDevices" lib/main.dart
          ! grep -A120 'Future<bool> configureThermalPrinter() async' lib/main.dart | grep -q 'PrintBluetoothThermal.bluetoothEnabled'
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml
      - name: Formatear analizar y probar
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-warnings --no-fatal-infos
          flutter test
      - name: Compilar APK release
        run: flutter build apk --release --build-name=1.2.9 --build-number=129
      - name: Validar APK
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Billares-Don-Miguel-APK-v1.2.9-build129
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
