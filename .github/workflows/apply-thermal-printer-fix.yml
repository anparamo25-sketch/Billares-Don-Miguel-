name: Apply thermal printer source fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-thermal-printer-fix.yml'
      - 'lib/main.dart'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply permanent source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """      if (!await PrintBluetoothThermal.bluetoothEnabled) {
        if (mounted) {
          await showDialog<void>(
            context: context,
            builder:
                (BuildContext dialogContext) => AlertDialog(
                  title: const Text('Bluetooth desactivado'),
                  content: const Text(
                    'Activa Bluetooth en la tablet y vuelve a pulsar Configurar impresora térmica.',
                  ),
                  actions: <Widget>[
                    FilledButton(
                      onPressed: () => Navigator.pop(dialogContext),
                      child: const Text('Cerrar'),
                    ),
                  ],
                ),
          );
        }
        return false;
      }
      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
"""
          new = """      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/main.dart
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          marker = 'Future<bool> configureThermalPrinter() async {'
          start = s.index(marker)
          end = s.index('Future<String?> printReceipt', start)
          block = s[start:end]
          if 'PrintBluetoothThermal.bluetoothEnabled' in block:
              raise SystemExit('ERROR: configureThermalPrinter todavía consulta bluetoothEnabled.')
          if 'PrintBluetoothThermal.pairedBluetooths' not in block:
              raise SystemExit('ERROR: configureThermalPrinter no consulta impresoras emparejadas.')
          print('CONFIGURE_THERMAL_PRINTER_BLUETOOTH_CHECK=FIXED')
          PY
      - name: Commit permanent correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo 'La corrección ya estaba aplicada permanentemente.'
            exit 0
          fi
          git commit -m 'fix: thermal printer configuration flow'
          git push
