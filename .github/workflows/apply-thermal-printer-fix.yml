name: Apply thermal printer source fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-thermal-printer-fix.yml'
      - 'lib/main.dart'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: thermal printer configuration flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply permanent source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """      if (!await PrintBluetoothThermal.bluetoothEnabled) return false;\n      if (!await PrintBluetoothThermal.isPermissionBluetoothGranted)\n        return false;\n      final List<BluetoothInfo> printers =\n          await PrintBluetoothThermal.pairedBluetooths;\n      if (printers.isEmpty) return false;\n"""
          new = """      if (!await PrintBluetoothThermal.bluetoothEnabled) {\n        if (mounted) {\n          await showDialog<void>(\n            context: context,\n            builder: (BuildContext dialogContext) => AlertDialog(\n              title: const Text('Bluetooth desactivado'),\n              content: const Text(\n                'Activa Bluetooth en la tablet y vuelve a pulsar Configurar impresora térmica.',\n              ),\n              actions: <Widget>[\n                FilledButton(\n                  onPressed: () => Navigator.pop(dialogContext),\n                  child: const Text('Cerrar'),\n                ),\n              ],\n            ),\n          );\n        }\n        return false;\n      }\n      final List<BluetoothInfo> printers =\n          await PrintBluetoothThermal.pairedBluetooths;\n      if (printers.isEmpty) {\n        if (mounted) {\n          await showDialog<void>(\n            context: context,\n            builder: (BuildContext dialogContext) => AlertDialog(\n              title: const Text('Sin impresoras emparejadas'),\n              content: const Text(\n                'Primero empareja la impresora térmica desde Ajustes > Bluetooth de Android. Después vuelve aquí para seleccionarla.',\n              ),\n              actions: <Widget>[\n                FilledButton(\n                  onPressed: () => Navigator.pop(dialogContext),\n                  child: const Text('Entendido'),\n                ),\n              ],\n            ),\n          );\n        }\n        return false;\n      }\n"""
          if old not in s:
              raise SystemExit('No se encontró exactamente el bloque de configuración térmica esperado')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/main.dart
          git diff --check
          git diff -- lib/main.dart
      - name: Commit permanent correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix: thermal printer configuration flow'
          git push
