name: Integrar impresora térmica en fuente

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-thermal-printer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Integrar configuración de impresora en main.dart
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/main.dart')
          source = path.read_text(encoding='utf-8')
          original = source

          if 'Future<bool> configureThermalPrinter() async' not in source:
              anchor = '  Future<String?> printReceipt(BillTable table) async {'
              if anchor not in source:
                  raise SystemExit('No se encontró la función printReceipt para integrar la configuración.')

              function = r'''  Future<bool> configureThermalPrinter() async {
    final SharedPreferences prefs = await SharedPreferences.getInstance();
    if (!mounted) return false;

    try {
      final bool enabled = await PrintBluetoothThermal.bluetoothEnabled;
      if (!enabled) {
        await showDialog<void>(
          context: context,
          builder: (BuildContext dialogContext) => AlertDialog(
            title: const Text('Impresora térmica'),
            content: const Text('Activa Bluetooth en la tablet y vuelve a abrir esta configuración.'),
            actions: <Widget>[
              FilledButton(
                onPressed: () => Navigator.pop(dialogContext),
                child: const Text('Cerrar'),
              ),
            ],
          ),
        );
        return false;
      }

      final bool permission =
          await PrintBluetoothThermal.isPermissionBluetoothGranted;
      if (!permission) {
        await showDialog<void>(
          context: context,
          builder: (BuildContext dialogContext) => AlertDialog(
            title: const Text('Permiso de Bluetooth'),
            content: const Text('Concede el permiso de Bluetooth a la aplicación y vuelve a abrir esta configuración.'),
            actions: <Widget>[
              FilledButton(
                onPressed: () => Navigator.pop(dialogContext),
                child: const Text('Cerrar'),
              ),
            ],
          ),
        );
        return false;
      }

      final List<BluetoothInfo> printers =
          await PrintBluetoothThermal.pairedBluetooths;
      if (printers.isEmpty) {
        await showDialog<void>(
          context: context,
          builder: (BuildContext dialogContext) => AlertDialog(
            title: const Text('Impresora térmica'),
            content: const Text('No hay impresoras térmicas Bluetooth emparejadas con esta tablet. Empareja primero la impresora desde los ajustes de Bluetooth de Android.'),
            actions: <Widget>[
              FilledButton(
                onPressed: () => Navigator.pop(dialogContext),
                child: const Text('Cerrar'),
              ),
            ],
          ),
        );
        return false;
      }

      final String? savedMac = prefs.getString('thermal_printer_mac');
      final String? savedName = prefs.getString('thermal_printer_name');
      final String? selectedMac = await showDialog<String>(
        context: context,
        builder: (BuildContext dialogContext) => AlertDialog(
          title: const Text('Impresora térmica'),
          content: SizedBox(
            width: double.maxFinite,
            child: ListView(
              shrinkWrap: true,
              children: printers.map((BluetoothInfo printer) {
                final bool selected = printer.macAdress == savedMac;
                return ListTile(
                  leading: Icon(selected ? Icons.check_circle : Icons.print_outlined),
                  title: Text(printer.name.isEmpty ? 'Impresora térmica' : printer.name),
                  subtitle: Text(printer.macAdress),
                  trailing: selected ? const Icon(Icons.check) : null,
                  onTap: () => Navigator.pop(dialogContext, printer.macAdress),
                );
              }).toList(),
            ),
          ),
          actions: <Widget>[
            if (savedMac != null)
              TextButton(
                onPressed: () async {
                  await prefs.remove('thermal_printer_mac');
                  await prefs.remove('thermal_printer_name');
                  if (dialogContext.mounted) Navigator.pop(dialogContext, '');
                },
                child: const Text('Quitar impresora'),
              ),
            FilledButton(
              onPressed: () => Navigator.pop(dialogContext),
              child: const Text('Cerrar'),
            ),
          ],
        ),
      );

      if (selectedMac == null) return savedMac != null;
      if (selectedMac.isEmpty) {
        if (mounted) {
          ScaffoldMessenger.of(context).showSnackBar(
            const SnackBar(content: Text('Impresora guardada eliminada')),
          );
        }
        return false;
      }

      final BluetoothInfo selected = printers.firstWhere(
        (BluetoothInfo printer) => printer.macAdress == selectedMac,
      );
      await prefs.setString('thermal_printer_mac', selected.macAdress);
      await prefs.setString('thermal_printer_name', selected.name);
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(content: Text('Impresora guardada: ${selected.name.isEmpty ? selected.macAdress : selected.name}')),
        );
      }
      return true;
    } catch (_) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('No se pudo abrir la configuración de impresora Bluetooth.')),
        );
      }
      return false;
    }
  }

'''
              source = source.replace(anchor, function + anchor, 1)

          old = '''      final BluetoothInfo printer = printers.first;
      final bool connected = await PrintBluetoothThermal.connect(
        macPrinterAddress: printer.macAdress,
      );'''
          new = '''      final SharedPreferences prefs = await SharedPreferences.getInstance();
      final String? savedMac = prefs.getString('thermal_printer_mac');
      if (savedMac == null || savedMac.isEmpty) {
        return 'Configura primero la impresora térmica desde Configuración.';
      }
      BluetoothInfo? printer;
      for (final BluetoothInfo item in printers) {
        if (item.macAdress == savedMac) {
          printer = item;
          break;
        }
      }
      if (printer == null) {
        return 'La impresora guardada ya no está emparejada. Ve a Configuración → Impresora térmica.';
      }
      final bool connected = await PrintBluetoothThermal.connect(
        macPrinterAddress: printer.macAdress,
      );'''
          if old not in source:
              raise SystemExit('No se encontró la selección automática de impresora que debe corregirse.')
          source = source.replace(old, new, 1)

          settings_anchor = "              const Text(\n                'Las tarifas no pueden modificarse desde el administrador.',\n              ),"
          if settings_anchor not in source:
              raise SystemExit('No se encontró el bloque de configuración de tarifas.')
          settings_insert = settings_anchor + '''
              const SizedBox(height: 12),
              OutlinedButton.icon(
                onPressed: () async {
                  Navigator.pop(context);
                  await configureThermalPrinter();
                },
                icon: const Icon(Icons.print_outlined),
                label: const Text('Impresora térmica'),
              ),'''
          source = source.replace(settings_anchor, settings_insert, 1)

          if source == original:
              raise SystemExit('La fuente no cambió.')
          path.write_text(source, encoding='utf-8')

      - name: Verificar integración permanente
        run: |
          set -euo pipefail
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "thermal_printer_mac" lib/main.dart
          grep -q "thermal_printer_name" lib/main.dart
          grep -q "Impresora térmica" lib/main.dart
          grep -q "Configura primero la impresora térmica" lib/main.dart
          grep -q "La impresora guardada ya no está emparejada" lib/main.dart
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart

      - name: Formatear y validar Dart
        run: |
          dart format lib/main.dart
          dart format --output=none --set-exit-if-changed lib/main.dart

      - name: Commit fuente permanente y retirar integración temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-thermal-printer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart .github/workflows/integrate-thermal-printer.yml
          git diff --cached --quiet && { echo 'No hay cambios para integrar'; exit 1; }
          git commit -m "Integra configuración permanente de impresora térmica"
          git push origin HEAD:main
