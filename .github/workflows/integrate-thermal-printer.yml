name: Integracion permanente impresora termica
"on":
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Aplicar integración permanente
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate_printer.py
          dart format lib/main.dart
          grep -q "Future<bool> configureThermalPrinter() async" lib/main.dart
          grep -q "thermal_printer_mac" lib/main.dart
          grep -q "thermal_printer_name" lib/main.dart
          grep -q "Impresora térmica" lib/main.dart
          grep -q "La impresora guardada ya no está emparejada" lib/main.dart
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          echo "INTEGRACION_FUENTE_VERIFICADA=OK"
      - name: Guardar fuente permanentemente
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/integrate-thermal-printer.yml .github/workflows/thermal-printer-integrate-once.yml .github/scripts/integrate_printer.py .github/integration.trigger || true
          git add lib/main.dart .github/workflows .github/scripts
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes en la integración."
            exit 0
          fi
          git commit -m "Integra configuración permanente de impresora térmica"
          git push origin HEAD:main
