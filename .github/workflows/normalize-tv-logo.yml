name: Billares Don Miguel - Normalizar logo TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Instalar herramientas WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Validar y reconstruir logo TV desde el bitstream real
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          source = Path('assets/tv-logo.webp')
          target = Path('cloud-tv/public/tv-logo.webp')
          if not source.is_file():
              raise SystemExit('No existe assets/tv-logo.webp')

          data = source.read_bytes()
          valid = False
          try:
              if data[:4] == b'RIFF' and data[8:12] == b'WEBP':
                  riff_size = struct.unpack_from('<I', data, 4)[0]
                  vp8 = data.find(b'VP8 ')
                  if vp8 >= 0 and vp8 + 8 <= len(data):
                      chunk_size = struct.unpack_from('<I', data, vp8 + 4)[0]
                      payload_end = vp8 + 8 + chunk_size
                      if 8 + riff_size == len(data) and payload_end <= len(data):
                          payload = data[vp8 + 8:payload_end]
                          if len(payload) >= 10 and payload[3:6] == b'\x9d\x01\x2a':
                              h = struct.unpack_from('<H', payload, 8)[0] & 0x3fff
                              valid = h == 90
          except (struct.error, IndexError):
              valid = False

          if valid:
              shutil.copy2(source, target)
              print('OK: logo TV ya es un WebP válido de 90px de alto; no se modifica.')
              raise SystemExit(0)

          vp8 = data.find(b'VP8 ')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP' or vp8 < 0 or vp8 + 8 > len(data):
              raise SystemExit('El archivo TV no contiene una estructura RIFF/WEBP recuperable')

          payload_start = vp8 + 8
          # El archivo original tiene tamaños RIFF/VP8 corruptos. VP8 es el último
          # chunk real, así que se recupera el bitstream desde su inicio hasta EOF.
          payload = data[payload_start:]
          if len(payload) < 10 or payload[3:6] != b'\x9d\x01\x2a':
              raise SystemExit('El bitstream VP8 real no es recuperable')

          raw_w = struct.unpack_from('<H', payload, 6)[0]
          raw_h = struct.unpack_from('<H', payload, 8)[0]
          width = raw_w & 0x3fff
          height = raw_h & 0x3fff
          if width <= 0 or height <= 0:
              raise SystemExit(f'Dimensiones VP8 inválidas: {width}x{height}')

          rebuilt = Path('/tmp/tv-logo-rebuilt.webp')
          decoded = Path('/tmp/tv-logo-source.png')
          final = Path('/tmp/tv-logo-final.webp')
          chunk = b'VP8 ' + struct.pack('<I', len(payload)) + payload
          if len(payload) & 1:
              chunk += b'\x00'
          rebuilt.write_bytes(b'RIFF' + struct.pack('<I', 4 + len(chunk)) + b'WEBP' + chunk)

          subprocess.run(['dwebp', str(rebuilt), '-o', str(decoded)], check=True)
          subprocess.run(['cwebp', '-quiet', '-resize', '0', '90', str(decoded), '-o', str(final)], check=True)
          shutil.copy2(final, source)
          shutil.copy2(final, target)
          print(f'OK: logo reconstruido desde VP8 real {width}x{height} y normalizado a 90px de alto.')
          PY

          webpinfo assets/tv-logo.webp >/dev/null
          webpinfo cloud-tv/public/tv-logo.webp >/dev/null
          cmp -s assets/tv-logo.webp cloud-tv/public/tv-logo.webp
          echo "OK: ambos logos TV son idénticos y WebP válidos."

      - name: Publicar corrección para activar el build principal y Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anparamo25-sketch@users.noreply.github.com"
          git add assets/tv-logo.webp cloud-tv/public/tv-logo.webp
          if git diff --cached --quiet; then
            echo "No hay corrección de logo que publicar."
          else
            git commit -m "fix: publicar logo TV WebP válido"
            git push origin HEAD:main
          fi
