name: Migración de fuente 1.2.9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'refactor: fuente directa 1.2.9 sin parches'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generar una vez la fuente actualmente inyectada
        run: python3 scripts/patch_tv_interface_1_2_9.py

      - name: Convertir la fuente generada en fuente permanente
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          s = main.read_text(encoding='utf-8')

          s = s.replace(
              "import 'package:print_bluetooth_thermal_plus/print_bluetooth_thermal.dart';",
              "import 'package:print_bluetooth_thermal/print_bluetooth_thermal.dart';",
          )

          s = re.sub(r'await PrintBluetoothThermal\.bluetoothEnabled\.timeout\(\s*const Duration\(seconds: 3\),\s*onTimeout: \(\) => false,\s*\)', 'await PrintBluetoothThermal.bluetoothEnabled', s)
          s = re.sub(r'await PrintBluetoothThermal\.isPermissionBluetoothGranted\.timeout\(\s*const Duration\(seconds: 3\),\s*onTimeout: \(\) => false,\s*\)', 'await PrintBluetoothThermal.isPermissionBluetoothGranted', s)
          s = re.sub(r'await PrintBluetoothThermal\.pairedBluetooths\.timeout\(\s*const Duration\(seconds: 5\),\s*onTimeout: \(\) => <BluetoothInfo>\[\],\s*\)', 'await PrintBluetoothThermal.pairedBluetooths', s)
          s = re.sub(r'await PrintBluetoothThermal\.connect\(\s*macPrinterAddress: ([^\n]+),\s*\)\.timeout\(\s*const Duration\(seconds: 8\),\s*onTimeout: \(\) => false,\s*\)', r'await PrintBluetoothThermal.connect(macPrinterAddress: \1)', s)

          # Elimina las tres tarjetas resumen, pero conserva Generado hoy.
          metric_fn = r'      final int available =.*?      Widget metricCard\(String title, String value, IconData icon\) \{.*?\n      \}\n\n      return SingleChildScrollView'
          s, n = re.subn(metric_fn, '      return SingleChildScrollView', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se pudo retirar el bloque de tarjetas resumen')
          cards = r"                metricCard\(\n                  'Disponibles',\n                  '\$available',\n                  Icons\.check_circle_outline,\n                \),\n                metricCard\('En juego', '\$playing', Icons\.sports_bar\),\n                metricCard\('Pendientes', '\$pending', Icons\.payments_outlined\),\n"
          s, n = re.subn(cards, '', s, count=1)
          if n != 1:
              raise SystemExit('No se pudieron retirar las tres tarjetas resumen')

          main.write_text(s, encoding='utf-8')

          pub = Path('pubspec.yaml')
          p = pub.read_text(encoding='utf-8').replace('print_bluetooth_thermal_plus: ^1.0.0', 'print_bluetooth_thermal: ^1.2.4')
          pub.write_text(p, encoding='utf-8')

          build = Path('.github/workflows/build-apk.yml')
          w = build.read_text(encoding='utf-8')
          old_step = '''      - name: Generar fuente TV 1.2.9
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_tv_interface_1_2_9.py
          grep -q "const String appVersion = '1.2.9+129'" lib/main.dart
          grep -q "String get tvHtml =>" lib/main.dart
          test -s cloud-tv/public/index.html
          echo "OK: fuente TV 1.2.9 generada y origen HTML presente"

'''
          if old_step in w:
              w = w.replace(old_step, '', 1)
          w = w.replace('          grep -q "print_bluetooth_thermal_plus" lib/main.dart\n', '          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart\n')
          build.write_text(w, encoding='utf-8')
          PY

      - name: Validar que no quede mecanismo de parcheo
        run: |
          test ! -e scripts/patch_tv_interface_1_2_9.py
          test ! -e .github/workflows/fix-cobrar-print-once.yml
          grep -q "print_bluetooth_thermal: ^1.2.4" pubspec.yaml
          grep -q "package:print_bluetooth_thermal/print_bluetooth_thermal.dart" lib/main.dart
          ! grep -q "Disponibles" lib/main.dart
          ! grep -q "En juego.*metricCard" lib/main.dart
          ! grep -q "Pendientes.*metricCard" lib/main.dart
          git diff --check

      - name: Guardar fuente corregida y eliminar migrador
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch_tv_interface_1_2_9.py .github/workflows/fix-cobrar-print-once.yml .github/workflows/source-migration-129.yml
          git add lib/main.dart pubspec.yaml .github/workflows/build-apk.yml
          git commit -m 'refactor: fuente directa 1.2.9 sin parches'
          git push origin main

      - name: Lanzar build definitivo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run .github/workflows/build-apk.yml --ref main
