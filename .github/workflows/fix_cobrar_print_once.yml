name: Fix Cobrar > Imprimir Bluetooth state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_cobrar_print_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Corregir permanentemente Cobrar > Imprimir
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()
          old = """      final bool enabled = await PrintBluetoothThermal.bluetoothEnabled;\n      if (!enabled) return 'Activa Bluetooth en la tablet para imprimir.';\n      final bool permission =\n          await PrintBluetoothThermal.isPermissionBluetoothGranted;\n      if (!permission) {\n        return 'Concede el permiso de Bluetooth y vuelve a intentar.';\n      }\n      final List<BluetoothInfo> printers =\n          await PrintBluetoothThermal.pairedBluetooths;\n      if (printers.isEmpty) {\n        return 'No hay impresoras Bluetooth emparejadas con la tablet.';\n      }\n"""
          new = """      // print_bluetooth_thermal 1.2.4 gestiona el permiso Bluetooth de Android 12+\n      // al consultar las impresoras emparejadas. No usamos bluetoothEnabled ni\n      // isPermissionBluetoothGranted como bloqueo previo porque ese estado puede\n      // devolver false aunque el adaptador ya este encendido, provocando el falso\n      // mensaje "Activa Bluetooth en la tablet" en Cobrar > Imprimir.\n      final List<BluetoothInfo> printers =\n          await PrintBluetoothThermal.pairedBluetooths;\n      if (printers.isEmpty) {\n        return 'No hay impresoras Bluetooth emparejadas con la tablet. Verifica el emparejamiento en Ajustes > Bluetooth.';\n      }\n"""
          if old not in s:
              raise SystemExit('No se encontro exactamente el flujo Cobrar > Imprimir que debe corregirse.')
          if s.count(old) != 1:
              raise SystemExit('El flujo Cobrar > Imprimir no es unico; se detiene para evitar una modificacion incorrecta.')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/main.dart
          git diff --check
          grep -q "print_bluetooth_thermal 1.2.4" lib/main.dart
          ! grep -q "final bool enabled = await PrintBluetoothThermal.bluetoothEnabled" lib/main.dart
          ! grep -q "final bool permission =" lib/main.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix: correct cobrar print bluetooth state'
          git push
